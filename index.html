<html lang="fr">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="data:application/json,{%22name%22:%22RestoPro%22,%22short_name%22:%22RestoPro%22,%22display%22:%22standalone%22,%22background_color%22:%22%23b8dca0%22,%22theme_color%22:%22%231B6FE8%22}">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<title>RestoPro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#b8dca0;position:fixed;-webkit-font-smoothing:antialiased;height:100%;width:100%;overflow:hidden}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* LOGIN */
#login-view{background:#1B6FE8;height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.pin-card{background:#f0fae0;border-radius:28px;padding:28px 20px 32px;width:100%;max-width:340px}
.pin-logo{text-align:center;margin-bottom:18px}
.pin-logo .ico{font-size:38px;display:block;margin-bottom:6px}
.pin-logo h1{font-size:22px;font-weight:700;color:#1a1a1a}
.pin-logo p{font-size:13px;color:#999;margin-top:2px}
.pin-display{background:#d0eab0;border:1.5px solid #e0e0e0;border-radius:14px;padding:16px 20px;margin-bottom:12px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:14px;transition:border-color .2s}
.pin-display.shake{animation:shake .4s;border-color:#e53935}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.dot{width:14px;height:14px;border-radius:50%;background:#ddd;transition:background .15s}
.dot.filled{background:#1a1a1a}
.role-hint{text-align:center;margin-bottom:18px;line-height:2}
.role-hint span{display:block;font-size:13px;color:#999}
.role-hint strong{color:#1a1a1a}
.keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.key{background:#b8dca0;border:none;border-radius:16px;width:min(80px,24vw);height:min(70px,18vw);font-size:min(24px,6vw);color:#1a1a1a;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 2px 6px rgba(0,0,0,.08);user-select:none;transition:background .1s}
.key:active{background:#ddd;transform:scale(.92)}
.key.eff{font-size:13px;font-weight:600;color:#555}
.key-bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;align-items:center}
.btn-ok{width:min(80px,24vw);height:min(70px,18vw);border-radius:16px;background:#1B6FE8;border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 2px 8px rgba(27,111,232,.4)}
.btn-ok:disabled{background:#ccc;box-shadow:none}
.pin-err{text-align:center;font-size:12px;color:#e53935;min-height:16px;margin-bottom:4px}
.demo-txt{text-align:center;font-size:10px;color:#ccc;margin-top:4px}

/* APP */
#app-view{display:none;height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#b8dca0;flex-direction:column}
.app-header{background:#1B6FE8;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.uname{font-size:18px;font-weight:700;color:#fff}
.urole{font-size:13px;color:rgba(255,255,255,.8);margin-top:1px}
.btn-deco{background:none;border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.modules-wrap{padding:16px 16px 28px;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#b8dca0;min-height:calc(100vh - 60px)}
.module-card{background:#e8f8d0;border-radius:50%;width:min(148px,42vw);height:min(148px,42vw);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:none;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .12s;margin:0 auto}
.module-card:active{transform:scale(.95)}
.mod-icon{font-size:min(40px,11vw);display:block;margin-bottom:7px;line-height:1}
.mod-title{font-size:13px;font-weight:700;color:#1a1a1a;margin-bottom:2px;padding:0 8px;line-height:1.2}
.mod-sub{font-size:10px;color:#999;line-height:1.3;padding:0 8px}
.notif-badge{position:absolute;top:10px;right:10px;background:#e53935;color:#fff;font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* MODULE */
#module-view{display:none;height:100vh;height:100dvh;background:#b8dca0;flex-direction:column}
.mod-header{background:#1B6FE8;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;flex-shrink:0}
.btn-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:2px 8px}
.mod-header h2{font-size:17px;font-weight:700;color:#fff}
.mod-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;background:#b8dca0}

/* FAB */
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:24px;width:58px;height:58px;border-radius:50%;background:#16a34a;color:#fff;border:none;font-size:30px;cursor:pointer;box-shadow:0 4px 16px rgba(22,163,74,.45);display:flex;align-items:center;justify-content:center;z-index:999}

/* COMMUNS */
.wcard{background:#f0fae0;border-radius:16px;padding:14px 16px;margin:12px 12px 0}
.wcard h3{font-size:13px;font-weight:700;color:#1a1a1a;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:5px 4px;color:#999;font-weight:600;border-bottom:1px solid #f0f0f0;font-size:11px}
.tbl td{padding:8px 4px;border-bottom:1px solid #f8f8f8;color:#1a1a1a;vertical-align:middle}
.tbl tr:last-child td{border:none}
.bk{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.ok{background:#e8f5e9;color:#2e7d32}.wn{background:#fff8e1;color:#f57f17}.er{background:#ffebee;color:#c62828}.inf{background:#e0f5cc;color:#1565c0}
.btn-blue{background:#1B6FE8;color:#fff;border:none;border-radius:22px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-out{background:#f0fae0;color:#1B6FE8;border:1.5px solid #1B6FE8;border-radius:22px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ff{margin-bottom:10px}
.ff label{display:block;font-size:11px;color:#999;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ff input,.ff select,.ff textarea{width:100%;padding:11px 12px;border:1.5px solid #e8e8e8;border-radius:10px;font-size:16px;color:#1a1a1a;background:#f0fae0;font-family:inherit}
.ff textarea{min-height:80px;resize:vertical}
.form-panel{background:#f0f6ff;border-radius:14px;padding:14px;border:1.5px solid #1B6FE8;margin-bottom:12px}
.taf-chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid #e5e7eb;background:#f0fae0;color:#555;cursor:pointer;margin-right:5px;margin-bottom:5px;display:inline-block}
.taf-chip.on{background:#1B6FE8;color:#fff;border-color:#1B6FE8}
.av{width:36px;height:36px;border-radius:50%;background:#1B6FE8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.alg-pill{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid #e0e0e0;background:#d8efb8;color:#555;cursor:pointer;margin:3px;display:inline-block}
.alg-pill.on{background:#ddf0c0;color:#1B6FE8;border-color:#1B6FE8}
.alerte-temp-banner{background:#ffebee;border-left:5px solid #c62828;border-radius:12px;padding:12px 14px;margin:10px 12px 0;display:flex;align-items:center;gap:12px;cursor:pointer}
.alerte-temp-banner.done{background:#e8f5e9;border-left-color:#22c55e}
@media print{#print-btns{display:none!important}body>*:not(#print-overlay){display:none!important}#print-overlay{position:static!important;padding:0!important}}
/* Brother QL-820NWBc — étiquettes 62mm */
@media print{
  @page{size:62mm auto;margin:0}
  .brother-label{width:62mm;padding:2mm;box-sizing:border-box;page-break-after:always;font-family:Arial,sans-serif}
  .brother-label *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print,.btn-print-cancel{display:none!important}
}
/* Bannière offline */
#offline-banner{position:fixed;top:0;left:0;right:0;background:#e53935;color:#fff;text-align:center;padding:8px 14px;font-size:13px;font-weight:700;z-index:9999;display:none;padding-top:calc(8px + env(safe-area-inset-top,0px));align-items:center;justify-content:center;gap:8px}
#offline-banner.show{display:flex}
#sync-indicator{position:fixed;bottom:80px;right:16px;background:#22c55e;color:#fff;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;z-index:9998;display:none;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#sync-indicator.show{display:flex}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes iapulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}

/* ── POLISH UX v2 ── */
* { -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #1B6FE8;
  --green-bg: #b8dca0;
  --card-bg: #f0fae0;
  --border: #dde8c8;
  --text: #1a1a1a;
  --text-muted: #888;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
}

/* Transitions globales */
button, .module-card, [onclick] { transition: transform .12s, opacity .12s, box-shadow .12s; }
button:active, .module-card:active { transform: scale(.96) !important; opacity: .9; }

/* Module cards améliorées */
.module-card {
  box-shadow: var(--shadow) !important;
  transition: transform .15s, box-shadow .15s !important;
}
.module-card:hover { transform: translateY(-2px) scale(1.02) !important; box-shadow: var(--shadow-lg) !important; }
.module-card:active { transform: scale(.94) !important; box-shadow: none !important; }

/* Inputs focus */
input:focus, select:focus, textarea:focus {
  outline: none !important;
  border-color: var(--blue) !important;
  box-shadow: 0 0 0 3px rgba(27,111,232,.15) !important;
  transition: border-color .2s, box-shadow .2s;
}

/* Boutons principaux */
.btn-blue {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 22px;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  transition: background .2s, transform .12s, box-shadow .2s;
  box-shadow: 0 4px 14px rgba(27,111,232,.35);
}
.btn-blue:active { transform: scale(.96); box-shadow: 0 2px 6px rgba(27,111,232,.25); }

/* Toast amélioré */
#toast {
  border-radius: 22px !important;
  box-shadow: 0 8px 24px rgba(0,0,0,.18) !important;
  font-weight: 600 !important;
  letter-spacing: .01em;
  backdrop-filter: blur(8px);
}

/* Scrollbars invisibles sur mobile */
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

/* FAB amélioré */
#fab-btn {
  box-shadow: 0 6px 20px rgba(27,111,232,.4) !important;
  transition: transform .15s, box-shadow .15s !important;
}
#fab-btn:active { transform: scale(.92) rotate(45deg) !important; }

/* Animations d'entrée pour les overlays */
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes popIn {
  0%   { transform: scale(.92); opacity: 0; }
  100% { transform: scale(1);   opacity: 1; }
}

/* Bannière offline */
#offline-banner { box-shadow: 0 2px 12px rgba(229,57,53,.3) !important; }

/* Notif badge pulse */
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.15); }
}
.notif-badge { animation: pulse 2s infinite; }

/* Module view transition */
#module-view { animation: fadeIn .18s ease; }

/* Labels form */
.ff label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  display: block;
  margin-bottom: 5px;
}
.ff input, .ff select, .ff textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  color: var(--text);
  box-sizing: border-box;
  transition: border-color .2s, box-shadow .2s;
}
.ff { margin-bottom: 12px; }

/* Cards avec hover */
div[style*="cursor:pointer"]:active { opacity: .85; }

/* Gradient header grille */
#grid-header {
  background: linear-gradient(180deg, #1B6FE8 0%, #1557c0 100%) !important;
}

/* Skeleton loading */
@keyframes shimmer {
  0%   { background-position: -200px 0; }
  100% { background-position: calc(200px + 100%) 0; }
}
.skeleton {
  background: linear-gradient(90deg, #f0fae0 25%, #e8f5d8 50%, #f0fae0 75%);
  background-size: 200px 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 8px;
}

/* Swipe indicator sur les listes */
.swipeable { position: relative; overflow: hidden; }

/* Status bar safe area */
.safe-top { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>

var pin = '';

function kRefresh() {
  for (var i = 0; i < 6; i++) {
    var d = document.getElementById('d' + i);
    if (i < 4) { d.style.display = 'block'; }
    else { d.style.display = (pin.length > i) ? 'block' : 'none'; }
    if (i < pin.length) { d.classList.add('filled'); } else { d.classList.remove('filled'); }
  }
  document.getElementById('btn-ok').disabled = (pin.length < 4);
  document.getElementById('pin-err').textContent = '';
}

function kPress(n) {
  if (pin.length >= 6) return;
  pin += String(n);
  kRefresh();
}

function kErase() {
  pin = pin.slice(0, -1);
  kRefresh();
}

function kLogin() {
  var foundUser = null;
  for (var i = 0; i < usersData.length; i++) {
    if (String(usersData[i].pin) === String(pin) && usersData[i].actif) {
      foundUser = {name: usersData[i].nom, role: usersData[i].role};
      break;
    }
  }
  if (!foundUser) foundUser = PINS[pin];
  if (!foundUser) {
    var d = document.getElementById('pin-disp');
    d.classList.add('shake');
    document.getElementById('pin-err').textContent = 'Code incorrect. Réessayez.';
    setTimeout(function() { d.classList.remove('shake'); pin = ''; kRefresh(); }, 800);
    return;
  }
  currentUser = foundUser.name;
  // Vérifier si l'user a un resto fixe assigné
  var userObj = usersData.find(function(u){ return String(u.pin) === String(pin); });
  var restoFixe = userObj && userObj.resto && userObj.resto !== '' && userObj.resto !== 'tous' ? userObj.resto : null;

  document.getElementById('login-view').style.display = 'none';

  if(restoFixe && restoFixe !== 'tous') {
    // Resto fixe assigné — pas de question
    choisirRestoAvecUser(foundUser, restoFixe);
  } else {
    // Montrer l'écran de choix resto
    document.getElementById('resto-username').textContent = foundUser.name.split(' ')[0] + ' !';
    var rv = document.getElementById('resto-view');
    rv.style.display = 'flex';
    rv.style.flexDirection = 'column';
    // Stocker temporairement
    rv._user = foundUser;
  }
}

  rv.style.display = 'none';

function checkDLCAlerts() {

        (nb_er ? nb_er + ' produit(s) expiré(s) !' : '') +
        (nb_er && nb_wn ? ' · ' : '') +
        (nb_wn ? nb_wn + ' produit(s) bientôt expirés' : '') +
      '</div>' +
      '<div style="font-size:11px;color:#888;margin-top:1px">Appuyez pour voir le détail</div>' +
    '</div>' +
    '<span style="font-size:18px;color:#f59e0b">›</span>';

    mw.parentNode.insertBefore(banner, mw);
  }

// ── Helper API Anthropic — résistant WiFi + 4G/5G ──
function anthropicFetch(body){
  return anthropicCall(body);
}

function anthropicCall(body, maxRetries){
  maxRetries = maxRetries !== undefined ? maxRetries : 4;
  var apiKey = (parametresData && parametresData.anthropicApiKey) || '';
  var headers = {
    "Content-Type": "application/json",
    "anthropic-dangerous-direct-browser-access": "true"
  };
  if(apiKey) headers["x-api-key"] = apiKey;

  // Timeouts progressifs selon la tentative (WiFi lent → 4G → 5G)
  var timeouts = [30000, 45000, 60000, 60000];

  function tryOnce(attempt){
    var timeout = timeouts[Math.min(attempt-1, timeouts.length-1)];
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timeoutId = controller ? setTimeout(function(){
      controller.abort();
    }, timeout) : null;

    var fetchOpts = {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body),
      // Pas de cache — important sur les réseaux captifs WiFi
      cache: "no-store",
      mode: "cors"
    };
    if(controller) fetchOpts.signal = controller.signal;

    return fetch("https://api.anthropic.com/v1/messages", fetchOpts)
      .then(function(r){
        if(timeoutId) clearTimeout(timeoutId);
        if(!r.ok && r.status === 0){
          // Status 0 = bloqué par réseau/CORS
          throw new Error("Network blocked (status 0)");
        }
        return r.json();
      })
      .catch(function(err){
        if(timeoutId) clearTimeout(timeoutId);
        var isAbort = err && err.name === 'AbortError';
        var isNetwork = err && (err.message||'').indexOf('fetch') >= 0;

        if(attempt < maxRetries){
          // Backoff exponentiel : 1s, 2s, 4s entre les tentatives
          var delay = Math.pow(2, attempt-1) * 1000;
          return new Promise(function(resolve, reject){
            setTimeout(function(){
              tryOnce(attempt + 1).then(resolve).catch(reject);
            }, delay);
          });
        }
        throw err;
      });
  }

  return tryOnce(1);
}


function showToast(msg, type, duration) {
  // Supprimer l'ancien toast
  var old=document.getElementById('toast-msg');if(old)old.remove();
  var t=document.createElement('div');
  t.id='toast-msg';
  var bg='rgba(26,26,26,.95)';
  if(type==='success'||(!type&&(msg.indexOf('✅')>=0||msg.indexOf('✓')>=0))) bg='rgba(22,163,74,.95)';
  else if(type==='error'||(!type&&(msg.indexOf('❌')>=0||msg.indexOf('Erreur')>=0))) bg='rgba(229,57,53,.95)';
  else if(type==='warning'||(!type&&msg.indexOf('⚠️')>=0)) bg='rgba(230,126,34,.95)';
  else if(!type&&(msg.indexOf('🤖')>=0||msg.indexOf('💡')>=0||msg.indexOf('ℹ️')>=0)) bg='rgba(27,111,232,.95)';
  t.style.cssText='position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-8px);background:'+bg+';color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;font-weight:600;z-index:9999;white-space:nowrap;max-width:85vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none';
  t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';});
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(-8px)';setTimeout(function(){if(t.parentNode)t.remove();},250);}, duration||2500);
}

function tafChrono(id) {
  var t = tafTasks.find(function(x){return x.id===id;});

  if (t.timer) { t.elapsed += Math.floor((Date.now()-t.start)/1000); clearInterval(t.timer); t.timer=null; t.start=null; }
  else { t.start = Date.now(); t.timer = setInterval(tafRefresh, 1000); }
  tafRefresh();
}
function tafDone(id) {
  var t = tafTasks.find(function(x){return x.id===id;});
  if (!t) return;
  if (t.timer) { t.elapsed += Math.floor((Date.now()-t.start)/1000); clearInterval(t.timer); t.timer=null; t.start=null; }
  t.done = !t.done; tafRefresh(); saveAll();
}
function tafDel(id) {
  var t = tafTasks.find(function(x){return x.id===id;});
  if (t && t.timer) clearInterval(t.timer);
  tafTasks = tafTasks.filter(function(x){return x.id!==id;});
  tafRefresh(); saveAll();
}

function prodSelectFiche(ficheId){
  if(!ficheId){
    var info=document.getElementById('pn-fiche-info');
    if(info){info.style.display='none';info.innerHTML='';}
    return;
  }
  var fiche=(fichesData||[]).find(function(f){return String(f.id)===String(ficheId);});
  if(!fiche) return;

  // Pré-remplir le nom
  var nomInp=document.getElementById('pn-nom');
  if(nomInp){nomInp.value=fiche.nom;prodAutoLot();}

  // Pré-remplir l'unité et la quantité (portions)
  var unInp=document.getElementById('pn-un');
  if(unInp) unInp.value='portion';
  var qteInp=document.getElementById('pn-qte');
  if(qteInp) qteInp.value=fiche.portions||1;

  // Afficher les ingrédients qui seront déduits
  var info=document.getElementById('pn-fiche-info');
  if(info&&fiche.ingredients&&fiche.ingredients.length){
    var ings=fiche.ingredients.map(function(i){return i.qte+' '+i.unite+' '+i.nom;}).join(', ');
    info.style.display='block';
    info.innerHTML='<strong>Ingrédients déduits du stock :</strong> '+ings;
  }
}

function prodAutoLot(){
  var nom=document.getElementById('pn-nom');
  var lotInp=document.getElementById('pn-lot');
  if(!nom||!lotInp) return;
  lotInp.value=prodGenLot(nom.value||'PROD');
}

function prodAdd() {
  var nom=document.getElementById('pn-nom').value.trim();
  if(!nom){alert('Entrez un nom');return;}
  var lot=document.getElementById('pn-lot').value.trim()||prodGenLot(nom);
  var qte=parseFloat(document.getElementById('pn-qte').value)||1;
  var unite=document.getElementById('pn-un').value;
  var par=document.getElementById('pn-par').value||'—';
  var now=new Date();

  // Récupérer la fiche sélectionnée si présente
  var ficheSelEl=document.getElementById('pn-fiche');
  var ficheId=ficheSelEl?ficheSelEl.value:'';
  var ficheSelectionnee=ficheId?(fichesData||[]).find(function(f){return String(f.id)===String(ficheId);}):null;

  prodItems.unshift({
    id:Date.now(), nom:nom, qte:qte, unite:unite, lot:lot,
    produitLe:document.getElementById('pn-produit').value||'—',
    dlc:document.getElementById('pn-dlc').value,
    par:par,
    obs:document.getElementById('pn-obs').value,
    ficheId:ficheId||null,
    fiche:!!ficheSelEl, favori:false
  });

  // ── Liaison Production → Stock ──
  // Ajouter le produit fini au stock (entrée)
  var dlcProd=document.getElementById('pn-dlc').value||'';
  var existingProdFini=stockItems.find(function(s){
    return s.nom.toLowerCase()===nom.toLowerCase();
  });
  if(existingProdFini){
    existingProdFini.qte=Math.round((existingProdFini.qte+qte)*100)/100;
    if(dlcProd) existingProdFini.dlc=dlcProd;
    existingProdFini.lot=lot;
    existingProdFini.scans=(existingProdFini.scans||0)+1;
  } else {
    stockItems.unshift({
      id:Date.now()+1,nom:nom,cat:'Préparation',
      qte:qte,unite:unite||'portion',min:0,
      fourn:'Cuisine',dlc:dlcProd,lot:lot,scans:1
    });
  }
  stockMouvements.push({
    id:Date.now()+2,type:'entree',source:'Production',
    nom:nom,lot:lot,qte:qte,unite:unite||'portion',
    par:par,date:now.toISOString().split('T')[0],
    heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    obs:'Produit fini : '+nom+(dlcProd?' DLC '+dlcProd:'')
  });

  var stockMsg='';

  // Si une fiche est sélectionnée → déduire ses ingrédients du stock
  if(ficheSelectionnee&&ficheSelectionnee.ingredients&&ficheSelectionnee.ingredients.length){
    var manquants=[];
    ficheSelectionnee.ingredients.forEach(function(ing){
      if(!ing.nom) return;
      var stockItem=stockItems.find(function(s){
        return s.nom.toLowerCase().indexOf(ing.nom.toLowerCase().slice(0,4))>=0||
               ing.nom.toLowerCase().indexOf(s.nom.toLowerCase().slice(0,4))>=0;
      });
      if(stockItem){
        var qteReelle=ing.qte*(qte/(ficheSelectionnee.portions||1));
        stockItem.qte=Math.max(0,Math.round((stockItem.qte-qteReelle)*100)/100);
        stockMouvements.push({
          id:Date.now()+Math.random(),type:'sortie',source:'Production',
          nom:ing.nom,lot:lot,qte:qteReelle,unite:ing.unite||'',
          par:par,date:now.toISOString().split('T')[0],
          heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
          obs:'Production '+nom+' (fiche: '+ficheSelectionnee.nom+')'
        });
      } else {
        manquants.push(ing.nom);
      }
    });
    stockMsg=manquants.length?' — Manquants en stock: '+manquants.join(', '):'✅ Stock ingrédients mis à jour !';
  } else {
    // Enregistrer juste un mouvement de sortie générique
    stockMouvements.push({
      id:Date.now(),type:'sortie',source:'Production',
      nom:nom,lot:lot,qte:qte,unite:unite,par:par,
      date:now.toISOString().split('T')[0],
      heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
      obs:'Production enregistree : '+nom
    });
    stockMsg='';
  }

  auditEnregistrer('production','Production enregistrée',nom+' x'+qte,'Production');
  var ov=document.querySelector('div[style*="z-index:5000"]');if(ov)ov.remove();
  saveAll();renderProd();
  showToast('Production enregistrée !'+stockMsg,'success',3000);
}

      '<div class="ff"><label>Produit le</label><input type="text" id="pe-pl" value="'+p.produitLe+'"></div>'+

function prodSauvegarder(id){
  var p=prodItems.find(function(x){return x.id===id;});
  if(!p) return;
  p.nom      =document.getElementById('pe-nom').value.trim()||p.nom;
  p.qte      =parseFloat(document.getElementById('pe-qte').value)||p.qte;
  p.unite    =document.getElementById('pe-un').value;
  p.produitLe=document.getElementById('pe-pl').value||p.produitLe;
  p.dlc      =document.getElementById('pe-dlc').value||p.dlc;
  p.lot      =document.getElementById('pe-lot').value||p.lot;
  p.par      =document.getElementById('pe-par').value||p.par;
  p.obs      =document.getElementById('pe-obs').value;
  var ov=document.querySelector('div[style*="z-index:5000"]');if(ov)ov.remove();
  saveAll();renderProd();showToast('Production mise a jour !');
}

function prodSupprimer(id){
  if(!confirm('Supprimer cette production ?'))return;
  prodItems=prodItems.filter(function(x){return x.id!==id;});
  var ov=document.querySelector('div[style*="z-index:5000"]');if(ov)ov.remove();
  saveAll();renderProd();
}

function brotherLabelHtml(data){
  // Génère le HTML d'une étiquette 62mm standard
  // data: {titre, nom, lot, dlc, poids, date, resto, user, extra:[{label,val}]}
  var now = new Date();
  var dateStr = data.date || (String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear());
  var resto = data.resto || (parametresData&&parametresData.nomResto1) || 'RestoPro';

  var html =
    // En-tête restaurant
    '<div style="background:#1B6FE8;color:#fff;text-align:center;padding:2mm 2mm 1mm;border-radius:2mm 2mm 0 0">'+
      '<div style="font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.5pt">'+resto+'</div>'+
      (data.titre?'<div style="font-size:7pt;opacity:.8">'+data.titre+'</div>':'')+
    '</div>'+
    // Nom produit
    '<div style="background:#fff;border:1.5pt solid #1B6FE8;border-top:none;padding:2mm;text-align:center">'+
      '<div style="font-size:13pt;font-weight:900;color:#1a1a1a;line-height:1.2">'+( data.nom||'—')+'</div>'+
    '</div>'+
    // DLC — encadré rouge
    (data.dlc?
      '<div style="background:#e53935;color:#fff;text-align:center;padding:2mm;margin-top:1mm;border-radius:1mm">'+
        '<div style="font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:0.5pt;opacity:.85">À consommer avant le</div>'+
        '<div style="font-size:16pt;font-weight:900;letter-spacing:0.5pt">'+data.dlc+'</div>'+
      '</div>'
    :'')+
    // Infos
    '<div style="border:1pt solid #ddd;border-radius:1mm;margin-top:1mm;overflow:hidden">';

  // Lot
  if(data.lot) html +=
    '<div style="display:flex;justify-content:space-between;padding:1.5mm 2mm;border-bottom:1pt solid #eee">'+
      '<span style="font-size:7pt;color:#888;font-weight:700;text-transform:uppercase">Lot</span>'+
      '<span style="font-size:8pt;font-weight:700;color:#1a1a1a;font-family:monospace">'+data.lot+'</span>'+
    '</div>';

  // Poids
  if(data.poids) html +=
    '<div style="display:flex;justify-content:space-between;padding:1.5mm 2mm;border-bottom:1pt solid #eee">'+
      '<span style="font-size:7pt;color:#888;font-weight:700;text-transform:uppercase">Poids</span>'+
      '<span style="font-size:8pt;font-weight:700;color:#1a1a1a">'+data.poids+'</span>'+
    '</div>';

  // Extra fields
  if(data.extra) data.extra.forEach(function(e){
    html +=
      '<div style="display:flex;justify-content:space-between;padding:1.5mm 2mm;border-bottom:1pt solid #eee">'+
        '<span style="font-size:7pt;color:#888;font-weight:700;text-transform:uppercase">'+e.label+'</span>'+
        '<span style="font-size:8pt;font-weight:700;color:#1a1a1a">'+e.val+'</span>'+
      '</div>';
  });

  // Date de production + user
  html +=
    '<div style="display:flex;justify-content:space-between;padding:1.5mm 2mm">'+
      '<span style="font-size:7pt;color:#888;font-weight:700;text-transform:uppercase">Produit le</span>'+
      '<span style="font-size:7pt;font-weight:700;color:#1a1a1a">'+dateStr+(data.user?' · '+data.user:'')+'</span>'+
    '</div>';

  html += '</div>';
  return html;
}

function printEtiquette(id){
  var p = prodItems.find(function(x){ return x.id===id; });

  var label = brotherLabelHtml({

var pointageSession = null;

function pointageGetSession(){
  var key='pointage_'+(currentUser||'unknown')+'_'+new Date().toISOString().split('T')[0];
  try{var raw=localStorage.getItem(key);if(raw)return JSON.parse(raw);}catch(e){}
  return null;
}

function pointageSaveSession(s){
  var key='pointage_'+(currentUser||'unknown')+'_'+new Date().toISOString().split('T')[0];
  try{localStorage.setItem(key,JSON.stringify(s));}catch(e){}
}

function pointageFormatDuration(ms){
  if(!ms||ms<0)ms=0;
  var totalSec=Math.floor(ms/1000);
  var h=Math.floor(totalSec/3600);
  var m=Math.floor((totalSec%3600)/60);
  var s=totalSec%60;
  return String(h).padStart(2,'0')+'h'+String(m).padStart(2,'0')+'m'+String(s).padStart(2,'0')+'s';
}

function pointageFormatHeure(ts){
  if(!ts)return '—';
  var d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function pointageAction(action){
  var now=Date.now();
  var session=pointageGetSession()||{debut:null,dernierDebut:null,pauseDebut:null,travailTotal:0,pauseTotal:0,etat:'nondemarre',fin:null,pauses:[]};
  if(action==='debut'){session.debut=now;session.dernierDebut=now;session.etat='travail';}
  else if(action==='pause'&&session.etat==='travail'){
    session.travailTotal+=(now-session.dernierDebut);session.dernierDebut=null;session.pauseDebut=now;session.etat='pause';
  }
  else if(action==='reprendre'&&session.etat==='pause'){
    var dp=now-session.pauseDebut;session.pauseTotal+=dp;
    if(!session.pauses)session.pauses=[];
    session.pauses.push({debut:session.pauseDebut,fin:now,duree:dp});
    session.pauseDebut=null;session.dernierDebut=now;session.etat='travail';
  }
  else if(action==='fin'){
    if(session.etat==='travail')session.travailTotal+=(now-session.dernierDebut);
    else if(session.etat==='pause'){var dp2=now-session.pauseDebut;session.pauseTotal+=dp2;if(!session.pauses)session.pauses=[];session.pauses.push({debut:session.pauseDebut,fin:now,duree:dp2});}
    session.fin=now;session.etat='fini';session.dernierDebut=null;session.pauseDebut=null;
    var user=currentUser||'Johnny Bauer';
    var ini=user.split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);
    var today=new Date().toISOString().split('T')[0];
    var heureDebut=pointageFormatHeure(session.debut);
    var heureFin=pointageFormatHeure(session.fin);
    var travailMs=session.travailTotal||0;
    var travailStr=pointageFormatDuration(travailMs);
    var pauseStr=pointageFormatDuration(session.pauseTotal||0);
    var entry={id:Date.now(),ini:ini,nom:user,poste:'—',heure:heureDebut,fin:heureFin,travail:travailStr,pause:pauseStr,statut:'ok',label:'Present',date:today};
    var existing=pointagesData.findIndex(function(p){return p.nom===user&&p.date===today;});
    if(existing>=0)pointagesData[existing]=entry;else pointagesData.unshift(entry);

    // ── Archivage permanent dans planningData ──
    // Chaque fin de journée crée/met à jour un enregistrement de présence
    // consultable par jour, semaine, mois
    var userObj=(usersData||[]).find(function(u){return u.nom===user;});
    var heuresDecimal=Math.round(travailMs/3600000*100)/100; // ex: 7.5h
    var archiveEntry={
      id:'ptg_'+user.replace(/\s/g,'_')+'_'+today,
      type:'pointage_archive',
      userId:userObj?userObj.id:null,
      nom:user,
      ini:ini,
      poste:userObj?userObj.poste||'—':'—',
      date:today,
      debut:heureDebut,
      fin:heureFin,
      travail:travailStr,
      pause:pauseStr,
      heures:heuresDecimal,
      pauses:session.pauses||[],
      resto:currentResto||'resto1'
    };
    // Remplacer si déjà existant (même jour même user)
    var archIdx=(planningData||[]).findIndex(function(p){
      return p.type==='pointage_archive'&&p.nom===user&&p.date===today;
    });
    if(archIdx>=0) planningData[archIdx]=archiveEntry;
    else planningData.unshift(archiveEntry);

    auditEnregistrer('pointages','Journée archivée',user+' '+heureDebut+'→'+heureFin+' ('+travailStr+')','Pointages');
    saveAll();
  }
  pointageSaveSession(session);
  if(pointageSession&&pointageSession._timer){clearInterval(pointageSession._timer);pointageSession._timer=null;}
  if(session.etat!=='fini'&&session.etat!=='nondemarre'){
    pointageSession=session;
    pointageSession._timer=setInterval(function(){var card=document.getElementById('my-pointage-card');if(card)pointageRenderMyCard(card,pointageGetSession());},1000);
  }
  var card=document.getElementById('my-pointage-card');
  if(card)pointageRenderMyCard(card,session);
  var msgs={debut:'Bonne journee !',pause:'Pause bien meritee !',reprendre:'C\'est reparti !',fin:'Journee terminee. Bravo !'};
  if(msgs[action])showToast(msgs[action]);
}

function pointRefresh(listDiv){
  if(!listDiv)listDiv=document.getElementById('point-list');
  if(!listDiv)return;
  listDiv.innerHTML='';

  var today=new Date().toISOString().split('T')[0];

  // ── Liaison 6 : Planning → Pointages ──
  // Afficher les employés planifiés aujourd'hui non encore pointés
  var shiftsToday=(planningData||[]).filter(function(p){
    return p.date===today&&p.type==='travail';
  });
  var planifies=shiftsToday.map(function(s){
    var user=(usersData||[]).find(function(u){return u.id===s.userId;});
    return user?{nom:user.nom,poste:user.poste||s.poste||'',debut:s.debut||'',fin:s.fin||'',userId:s.userId}:null;
  }).filter(Boolean);

  var pointesNoms=pointagesData.map(function(p){return p.nom;});
  var nonPointes=planifies.filter(function(p){return pointesNoms.indexOf(p.nom)<0;});

  if(nonPointes.length){
    var planTitle=document.createElement('div');
    planTitle.style.cssText='font-size:11px;font-weight:800;color:#1B6FE8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-top:4px';
    planTitle.textContent='📅 PLANIFIÉS — NON ENCORE POINTÉS ('+nonPointes.length+')';
    listDiv.appendChild(planTitle);

    nonPointes.forEach(function(p){
      var row=document.createElement('div');
      row.style.cssText='background:#e8f0ff;border-left:3px solid #1B6FE8;border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px';
      var ini=p.nom.split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);
      row.innerHTML=
        '<div class="av" style="background:#1B6FE8">'+ini+'</div>'+
        '<div style="flex:1">'+
          '<div style="font-size:13px;font-weight:700;color:#1a1a1a">'+p.nom+'</div>'+
          '<div style="font-size:11px;color:#888">'+p.poste+(p.debut?' · Prévu '+p.debut+(p.fin?' → '+p.fin:''):'')+'</div>'+
        '</div>';
      var pointerBtn=document.createElement('button');

        var ini2=employe.nom.split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);

function pointAdd(){
  var nom=document.getElementById('pt-nom').value.trim();
  if(!nom){alert('Entrez un nom');return;}
  var arr=document.getElementById('pt-arr').value||'—';
  var poste=document.getElementById('pt-poste').value;
  var ini=nom.split(' ').map(function(x){return x[0];}).join('').toUpperCase().slice(0,2);
  pointagesData.unshift({id:Date.now(),ini:ini,nom:nom,poste:poste,heure:arr,statut:'ok',label:'Present',date:new Date().toISOString().split('T')[0]});

}

function pointDel(id){
  pointagesData=pointagesData.filter(function(x){return x.id!==id;});

}

function briefSection(wrap, ico, titre, collapsed, fillFn){
  var sec=document.createElement('div');
  sec.style.cssText='background:#f0fae0;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)';
  var hdr=document.createElement('div');
  hdr.style.cssText='padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer';
  var arrow=document.createElement('span');
  arrow.style.cssText='color:#888;font-size:14px;flex-shrink:0';
  arrow.innerHTML=collapsed?'&#9654;':'&#9660;';
  hdr.innerHTML='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">'+ico+'</span><span style="font-size:15px;font-weight:700;color:#1a1a1a">'+titre+'</span></div>';
  hdr.appendChild(arrow);
  var body=document.createElement('div');
  body.style.display=collapsed?'none':'block';
  fillFn(body);
  hdr.onclick=function(){
    body.style.display=body.style.display==='none'?'block':'none';
    arrow.innerHTML=body.style.display==='none'?'&#9654;':'&#9660;';
  };
  sec.appendChild(hdr);sec.appendChild(body);wrap.appendChild(sec);
  return sec;
}

  var now=new Date();

function renderChecklists(){

function renderChkValidation(el){
  var svcDiv=document.createElement('div');
  svcDiv.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee';
  [{id:'midi',label:'Midi',ico:'&#9728;&#65039;'},{id:'soir',label:'Soir',ico:'&#127769;'},{id:'semaine',label:'Hebdo',ico:'&#128197;'}].forEach(function(s){

    b.style.cssText='padding:10px;font-size:13px;font-weight:'+(active?'700':'500')+';background:'+(active?'#1B6FE8':'#fff')+';color:'+(active?'#fff':'#555')+';border:1.5px solid '+(active?'#1B6FE8':'#ddd')+';border-radius:10px;cursor:pointer';

    b.onclick=(function(sid){return function(){chkService=sid;renderChecklists();};})(s.id);

  });
  el.appendChild(svcDiv);
  var wrap=document.createElement('div');
  wrap.style.cssText='padding:10px 12px 80px;overflow-y:auto';
  var filtered=chkGroupes.filter(function(g){return g.service===chkService||chkService==='semaine';});
  if(!filtered.length){wrap.innerHTML='<div style="text-align:center;padding:40px;color:#bbb;font-size:14px">Aucune check-list pour ce service</div>';el.appendChild(wrap);return;}
  filtered.forEach(function(grp){
    var done=grp.taches.filter(function(t){return t.fait;}).length;
    var total=grp.taches.length;
    var card=document.createElement('div');
    card.style.cssText='background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)';

      '<span style="font-size:13px;font-weight:700;color:'+(done===total?'#22c55e':'#1B6FE8')+'">'+done+'/'+total+'</span>';

      row.onclick=function(){
        t.fait=!t.fait;
        if(t.fait){var now=new Date();chkHistorique.unshift({grp:grp.titre,tache:t.label,par:currentUser||'Johnny Bauer',heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')});}

function checkAllAlertsFull(){
  // DLC dans 3 jours
  var dlcAlerts=0;
  stockItems.forEach(function(s){
    if(!s.dlc)return;
    var p=s.dlc.split('/');if(p.length<2)return;
    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):new Date().getFullYear();
    var d=new Date(y,parseInt(p[1])-1,parseInt(p[0]));
    var diff=Math.round((d-new Date())/86400000);
    if(diff<=3){
      dlcAlerts++;
      addNotif('DLC proche : '+s.nom+(diff<0?' (depassee '+(Math.abs(diff))+'j)':' (J-'+diff+')'),'critical','Stock');
    }
  });

  // Frigos non contrôlés
  var frigosNonFaits=frigosData.filter(function(f){return !f.fait;}).length;
  if(frigosNonFaits>0){
    addNotif(frigosNonFaits+" frigo(s) non controles aujourd'hui",'warning','Temperatures');
  }

  // Frigos hors norme
  frigosData.forEach(function(f){
    if(f.fait&&f.val!==null&&(f.val<f.smin||f.val>f.lim)){
      addNotif('Température hors norme : '+f.nom+' ('+f.val+'°C)','critical','Temperatures');
    }
  });

  // Stock rupture
  var ruptures=stockItems.filter(function(s){return s.qte===0;}).length;
  if(ruptures>0){
    addNotif(ruptures+' article(s) en rupture de stock','warning','Stock');
  }

  // Stock faible
  var faibles=stockItems.filter(function(s){return s.qte>0&&s.qte<=s.min;}).length;
  if(faibles>0){
    addNotif(faibles+' article(s) sous le stock minimum','info','Stock');
  }

  updateNotifBadge();
}

function scanInventaireAfficher(info){
  var resultDiv=document.getElementById('inv-result');
  if(!resultDiv) return;

  // Chercher le produit dans le stock
  var stockMatch=null;
  if(info.nom){
    stockMatch=stockItems.find(function(s){
      return s.nom.toLowerCase().indexOf(info.nom.toLowerCase().slice(0,5))>=0||
             info.nom.toLowerCase().indexOf(s.nom.toLowerCase().slice(0,5))>=0;
    });
  }
  if(!stockMatch&&info.lot){
    stockMatch=stockItems.find(function(s){return s.lot&&s.lot===info.lot;});
  }

  // Chercher dans les réceptions
  var recepMatch=null;
  if(info.lot){
    recepItems.forEach(function(r){
      if(r.lignesProduits) r.lignesProduits.forEach(function(p){
        if(p.lot===info.lot) recepMatch=r;
      });
    });
  }

  var dlcDiff=null, dlcCol='#888';
  if(info.dlc){
    var p=info.dlc.split('/');
    if(p.length>=2){
      var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):new Date().getFullYear();
      var dDlc=new Date(y,parseInt(p[1])-1,parseInt(p[0]));
      dlcDiff=Math.round((dDlc-new Date())/86400000);
      dlcCol=dlcDiff<0?'#e53935':dlcDiff<=7?'#e67e22':'#16a34a';
    }
  }

  resultDiv.innerHTML='';

  // Résultat scan
  var scanCard=document.createElement('div');
  scanCard.style.cssText='background:#f3e8ff;border-radius:14px;padding:14px;margin-bottom:10px';
  scanCard.innerHTML='<div style="font-size:11px;font-weight:800;color:#9b59b6;text-transform:uppercase;margin-bottom:10px">ÉTIQUETTE SCANNÉE</div>'+
    '<div style="font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:8px">'+(info.nom||'Produit détecté')+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px">'+
      (info.dlc?'<span style="background:#fff;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:'+dlcCol+'">DLC: '+info.dlc+(dlcDiff!==null?' (J'+(dlcDiff>=0?'-':'')+dlcDiff+')':'')+'</span>':'')+
      (info.lot?'<span style="background:#fff;border-radius:8px;padding:4px 8px;font-size:11px;color:#1B6FE8;font-family:monospace">Lot: '+info.lot+'</span>':'')+
      (info.poids?'<span style="background:#fff;border-radius:8px;padding:4px 8px;font-size:11px;color:#555">'+info.poids+' '+(info.unite||'')+'</span>':'')+
      (info.fournisseur?'<span style="background:#fff;border-radius:8px;padding:4px 8px;font-size:11px;color:#888">'+info.fournisseur+'</span>':'')+
    '</div>';
  resultDiv.appendChild(scanCard);

  // Correspondance stock
  var stockCard=document.createElement('div');
  stockCard.style.cssText='background:'+(stockMatch?'#e8f5e9':'#fff8e1')+';border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid '+(stockMatch?'#22c55e':'#f59e0b');
  if(stockMatch){
    stockCard.innerHTML='<div style="font-size:11px;font-weight:800;color:#16a34a;text-transform:uppercase;margin-bottom:6px">✓ TROUVÉ EN STOCK</div>'+
      '<div style="font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:6px">'+stockMatch.nom+'</div>'+
      '<div style="display:flex;gap:10px;font-size:13px">'+
        '<span>Qté système: <strong>'+stockMatch.qte+' '+stockMatch.unite+'</strong></span>'+
        (stockMatch.lot?'<span>Lot: <strong>'+stockMatch.lot+'</strong></span>':'')+
      '</div>';
  } else {
    stockCard.innerHTML='<div style="font-size:11px;font-weight:800;color:#d97706;text-transform:uppercase;margin-bottom:6px">⚠️ NON TROUVÉ EN STOCK</div>'+
      '<div style="font-size:13px;color:#555">Ce produit ne correspond à aucun article du stock système.</div>';
  }
  resultDiv.appendChild(stockCard);

  // Correspondance réception
  if(recepMatch){
    var recepCard=document.createElement('div');
    recepCard.style.cssText='background:#e8f0ff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid #1B6FE8';
    recepCard.innerHTML='<div style="font-size:11px;font-weight:800;color:#1B6FE8;text-transform:uppercase;margin-bottom:6px">📥 RÉCEPTION ORIGINE</div>'+
      '<div style="font-size:13px;color:#1a1a1a">'+recepMatch.fourn+' · '+recepMatch.date+'</div>'+
      (recepMatch.signe?'<div style="font-size:11px;color:#888;margin-top:2px">Réceptionné par: '+recepMatch.signe+'</div>':'');
    resultDiv.appendChild(recepCard);
  }

  // Boutons action
  var btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:8px;margin-top:4px';
  var addBtn=document.createElement('button');
  addBtn.style.cssText='flex:1;background:#9b59b6;color:#fff;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer';
  addBtn.innerHTML='📦 Ajouter au stock';
  addBtn.onclick=function(){scanAjouterAuStock(info,document.getElementById('scan-inv-overlay'));showToast('Ajouté au stock !');};
  var newScanBtn=document.createElement('button');
  newScanBtn.style.cssText='background:#f0fae0;color:#555;border:1.5px solid #dde8c8;border-radius:12px;padding:12px;font-size:13px;cursor:pointer;min-width:80px;font-weight:600';
  newScanBtn.innerHTML='🔄 Nouveau';
  newScanBtn.onclick=function(){resultDiv.innerHTML='';var prev=document.getElementById('inv-preview');if(prev)prev.innerHTML='<div style="text-align:center;color:#888"><div style="font-size:40px;margin-bottom:8px">🔍</div><div style="font-size:13px">Prenez une photo</div></div>';};
  btns.appendChild(addBtn);btns.appendChild(newScanBtn);
  resultDiv.appendChild(btns);

  // Enregistrer dans l'historique
  scanHistory.unshift({id:Date.now(),nom:info.nom||'Scan',dlc:info.dlc||'',lot:info.lot||'',mode:'inventaire',date:new Date().toISOString().split('T')[0],statut:stockMatch?'✓ En stock':'⚠️ Absent'});
  saveAll();
}

    if(parametresData&&parametresData.anthropicApiKey) hdrs["x-api-key"] = parametresData.anthropicApiKey;

    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", signal:(function(){try{var c=new AbortController();setTimeout(function(){c.abort();},45000);return c.signal;}catch(e){return undefined;}})(), headers:hdrs,
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1500,
        messages:[{role:"user", content:[
          {type:"image", source:{type:"base64", media_type: mime.startsWith('image/')?mime:'image/jpeg', data:b64}},
          {type:"text", text: prompts[selectedType]||prompts.autre}
        ]}]
      })
    })
    .then(function(r){return r.json();})
    .then(function(data){
      var txt = data.content&&data.content[0] ? data.content[0].text : '';
      var usage = data.usage || {};
      var tokensIn = usage.input_tokens||0;
      var tokensOut = usage.output_tokens||0;
      var cout = Math.round((tokensIn/1000000*3 + tokensOut/1000000*15)*10000)/100;
      txt = txt.replace(/```json|```/g,'').trim();
      var result;
      try{ result = JSON.parse(txt); } catch(ex){ result = {erreur: "Impossible de parser", raw: txt}; }

      // Score de confiance basique
      var fields = Object.values(result).filter(function(v){return v!==null&&v!==undefined&&v!=='';});
      var totalFields = Object.keys(result).length;
      var confidence = totalFields>0 ? Math.round(fields.length/totalFields*100) : 0;

      afficherResultat(result, tokensIn, tokensOut, cout, confidence, txt);
    })
    .catch(function(err){
      ov.innerHTML = '';
      var hdrE=document.createElement('div');
      hdrE.style.cssText='background:#e53935;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));flex-shrink:0';
      hdrE.innerHTML='<div style="font-size:17px;font-weight:700;color:#fff">Erreur</div>';
      ov.appendChild(hdrE);
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:30px;text-align:center';
      var errMsg = err ? (err.message||String(err)) : 'Erreur inconnue';
      var apiKey = parametresData&&parametresData.anthropicApiKey;
      errDiv.innerHTML =
        '<div style="font-size:48px;margin-bottom:16px">❌</div>'+
        '<div style="font-size:15px;font-weight:700;color:#e53935;margin-bottom:8px">Erreur appel API</div>'+
        '<div style="background:#f5f5f5;border-radius:10px;padding:10px 14px;font-size:11px;color:#555;font-family:monospace;margin-bottom:12px;word-break:break-all;max-width:300px">'+errMsg+'</div>'+
        (!apiKey?'<div style="background:#ffebee;border-radius:10px;padding:10px 14px;font-size:13px;color:#e53935;font-weight:700;margin-bottom:12px">Aucune cle API configuree<br>Parametres → IA / API</div>':
          '<div style="background:#e8f5e9;border-radius:10px;padding:8px 12px;font-size:12px;color:#16a34a;margin-bottom:12px">Cle API presente</div>');
      var retryBtn = document.createElement('button');
      retryBtn.style.cssText = 'background:#1B6FE8;color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;width:100%;max-width:280px';
      retryBtn.textContent = 'Retour';
      retryBtn.onclick = function(){ renderMain(); };
      errDiv.appendChild(retryBtn);
      ov.appendChild(errDiv);
    });
  }

  function afficherResultat(result, tokensIn, tokensOut, cout, confidence, rawTxt){
    ov.innerHTML = '';
    var hdr = document.createElement('div');
    hdr.style.cssText = 'background:#1B6FE8;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;flex-shrink:0';
    var bk = document.createElement('button');
    bk.style.cssText = 'background:rgba(255,255,255,.2);border:none;color:#fff;font-size:22px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0';
    bk.innerHTML = '&#8592;'; bk.onclick = function(){ renderMain(); selectedFile=null; selectedFileData=null; renderMain(); };
    hdr.appendChild(bk);
    hdr.innerHTML += '<div style="font-size:17px;font-weight:700;color:#fff">Résultat</div>';
    ov.appendChild(hdr);

    var wrap = document.createElement('div');
    wrap.style.cssText = 'overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:14px 14px 100px';

    // Header résultat
    var resHdr = document.createElement('div');

    var resTitle = document.createElement('div');
    resTitle.innerHTML = '<div style="font-size:13px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em">RÉSULTAT</div>'+
      '<div style="font-size:11px;color:#bbb;margin-top:3px">'+tokensIn+' tokens in · '+tokensOut+' out · $'+cout+'</div>';
    var confBadge = document.createElement('div');
    var confColor = confidence>=80?'#16a34a':confidence>=50?'#e67e22':'#e53935';
    confBadge.style.cssText = 'background:'+(confidence>=80?'#e8f5e9':confidence>=50?'#fff8e1':'#ffebee')+';color:'+confColor+';border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;flex-shrink:0';
    confBadge.textContent = 'Confiance '+confidence+'/100';
    resHdr.appendChild(resTitle); resHdr.appendChild(confBadge);
    wrap.appendChild(resHdr);

    // JSON extrait
    var jsonTitle = document.createElement('div');
    jsonTitle.style.cssText = 'font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px';

    var jsonBox = document.createElement('div');
    jsonBox.style.cssText = 'background:#1a1a2e;border-radius:12px;padding:14px;font-family:monospace;font-size:12px;color:#e8f0fe;line-height:1.7;margin-bottom:14px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:250px;overflow-y:auto';
    jsonBox.textContent = JSON.stringify(result, null, 2);
    wrap.appendChild(jsonBox);

    ov.appendChild(wrap);

    // Boutons
    var btns = document.createElement('div');
    btns.style.cssText = 'background:#f0fae0;border-top:1px solid #dde8c8;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;flex-shrink:0';

    var valBtn = document.createElement('button');
    valBtn.style.cssText = 'width:100%;background:#16a34a;color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;box-sizing:border-box';
    valBtn.innerHTML = '✓ Valider';
    valBtn.onclick = function(){
      // Sauvegarder selon le type
      if(selectedType==='bl'||selectedType==='autre'){
        // → Module Achats
        var fourn = result.fournisseur_nom||result.fournisseur||result.emetteur||'Fournisseur inconnu';
        var montant = result.montant_ht||result.montant||0;
        var dateDoc = result.date_jj_mm_aaaa||result.date||new Date().toISOString().split('T')[0];
        if(dateDoc&&dateDoc.match(/\d{2}\/\d{2}\/\d{4}/)){
          var p=dateDoc.split('/'); dateDoc=p[2]+'-'+p[1]+'-'+p[0];
        }
        achatsData.unshift({
          id:Date.now(), fourn:fourn, produit:result.numero_bl||'BL scanné',
          qte:1, unite:'facture', montant:parseFloat(montant)||0,
          date:dateDoc, facture:result.numero_bl||'',
          bl_photo:selectedFileData, bl_data:result,
          source:'scan_unitaire', resto:currentResto||'resto1'
        });
        // Ajouter fournisseur à la liste
        if(fourn&&fournisseursList.indexOf(fourn)<0) fournisseursList.push(fourn);
        // Si des produits sont listés, ajouter au stock
        if(result.produits&&Array.isArray(result.produits)){
          result.produits.forEach(function(p){
            if(!p.nom) return;
            var qty = parseFloat(p.qte)||1;
            var existing = stockItems.find(function(s){return s.nom.toLowerCase()===p.nom.toLowerCase();});
            if(existing){ existing.qte=Math.round((existing.qte+qty)*100)/100; existing.fourn=fourn; }
            else stockItems.unshift({id:Date.now()+Math.random(),nom:p.nom,cat:'Alimentaire',qte:qty,unite:p.unite||'kg',min:0,fourn:fourn,dlc:'',lot:'',scans:0});
          });
        }
        auditEnregistrer('scanner','BL/Facture scanné',fourn,'Scanner');
        saveAll();
        ov.remove();
        showToast('✅ BL enregistré dans Achats !','success',3000);
      } else if(selectedType==='etiquette'){
        // → Stock directement
        var nom = result.nom||'Produit scanné';
        var poids = parseFloat(result.poids_kg)||1;
        var dlc = result.dlc_jj_mm_aaaa||null;
        if(dlc&&dlc.match(/\d{2}\/\d{2}\/\d{4}/)){var p=dlc.split('/');dlc=p[2]+'-'+p[1]+'-'+p[0];}
        var existing = stockItems.find(function(s){return s.nom.toLowerCase()===nom.toLowerCase();});
        if(existing){ existing.qte=Math.round((existing.qte+poids)*100)/100; if(dlc)existing.dlc=dlc; if(result.lot)existing.lot=result.lot; existing.scans=(existing.scans||0)+1; }
        else stockItems.unshift({id:Date.now(),nom:nom,cat:'Alimentaire',qte:poids,unite:'kg',min:0,fourn:result.fournisseur||'',dlc:dlc||'',lot:result.lot||'',scans:1});
        auditEnregistrer('scanner','Étiquette scannée',nom,'Scanner');
        saveAll();
        ov.remove();
        showToast('✅ '+nom+' ajouté au stock !','success',3000);
      } else {
        saveAll(); ov.remove();
        showToast('✅ Document enregistré !','success');
      }
    };

    var rejBtn = document.createElement('button');
    rejBtn.style.cssText = 'width:100%;background:#ffebee;color:#e53935;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;box-sizing:border-box';
    rejBtn.innerHTML = '✕ Rejeter';
    rejBtn.onclick = function(){ selectedFile=null; selectedFileData=null; renderMain(); };

    var newBtn = document.createElement('button');
    newBtn.style.cssText = 'width:100%;background:none;color:#1B6FE8;border:none;padding:10px;font-size:14px;cursor:pointer;font-weight:600';
    newBtn.innerHTML = '↺ Nouveau scan';
    newBtn.onclick = function(){ selectedFile=null; selectedFileData=null; renderMain(); };

    btns.appendChild(valBtn); btns.appendChild(rejBtn); btns.appendChild(newBtn);
    ov.appendChild(btns);
  }

  renderMain();
  document.body.appendChild(ov);
}

function recepDemarrer(overlay){
  var fourn=document.getElementById('recep-fourn').value.trim();
  if(!fourn){var inp=document.getElementById('recep-fourn');inp.style.borderColor='#e53935';setTimeout(function(){inp.style.borderColor='#dde8c8';},1000);return;}

  function validerSession(avecBL){
    var temp = parseFloat(document.getElementById('recep-temp')?document.getElementById('recep-temp').value:0)||null;
    var conforme = document.getElementById('recep-conforme')?document.getElementById('recep-conforme').value:'conforme';
    var obs = document.getElementById('recep-obs')?document.getElementById('recep-obs').value:'';
    var now = new Date();
    var statut = conforme==='conforme'?'validee':conforme==='non_conforme'?'critique':'alerte';

    var prods = session.etiquettes.map(function(e){
      return {nom:e.nom, qte:e.poids||1, lot:e.lot||'', dlc:e.dlc||'', temp:temp, conforme:conforme==='conforme'?'conforme':'non_conforme'};
    });

    var recep = {
      id: Date.now(),
      fourn: fourn,
      date: dateVal,
      heure: String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
      art: prods.length+' étiq.',
      lignes: prods.length+' lignes',
      montantHT: 0,
      tempReception: temp,
      conforme: conforme,
      obs: obs,
      signe: session.signe||currentUser||'—',
      photoBL: avecBL&&session.photoBL ? session.photoBL : null,
      lignesProduits: prods,
      statut: statut,
      label: statut==='validee'?'Validée':statut==='critique'?'Non conforme':'Réserve',
      produits: prods.map(function(p){return p.nom;}).join(', '),
      resto: currentResto||'resto1',
      bl: avecBL ? 'BL-'+Date.now().toString().slice(-6) : 'HACCP-'+Date.now().toString().slice(-6)
    };

    recepItems.unshift(recep);

    // → STOCK : ajouter chaque produit scanné
    prods.forEach(function(p){
      if(!p.nom) return;
      var qty = parseFloat(p.qte)||1;
      var existing = stockItems.find(function(s){return s.nom.toLowerCase()===p.nom.toLowerCase();});
      if(existing){
        existing.qte = Math.round((existing.qte+qty)*100)/100;
        if(p.dlc) existing.dlc = p.dlc;
        if(p.lot) existing.lot = p.lot;
        existing.scans = (existing.scans||0)+1;
        existing.fourn = fourn;
      } else {
        stockItems.unshift({id:Date.now()+Math.random(),nom:p.nom,cat:'Alimentaire',qte:qty,unite:'kg',min:0,fourn:fourn,dlc:p.dlc||'',lot:p.lot||'',scans:1});

    });

    auditEnregistrer('recep','Réception validée',fourn+' — '+prods.length+' produit(s)','Réceptions');
    saveAll();
    ov.remove();
    renderReceptions();
    showToast('✅ '+prods.length+' produit(s) → Stock mis à jour !','success',3000);
  }

  renderScanEtiquettes();
}

function recepValider(id){
  var r=recepItems.find(function(x){return x.id===id;});
  if(r)r.statut='validee';
  var ov=document.querySelector('[data-overlay]');if(ov)ov.remove();
  saveAll();renderReceptions();showToast('Reception validee !');
}

function recepSupprimer(id){
  recepItems=recepItems.filter(function(x){return x.id!==id;});
  var ov=document.querySelector('[data-overlay]');if(ov)ov.remove();
  saveAll();renderReceptions();
}

function recepGererFournisseurs(parent){
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:6000;display:flex;align-items:flex-end;justify-content:center';
  var box=document.createElement('div');
  box.style.cssText='background:#f0fae0;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto';

  function renderFL(){
    box.innerHTML='<div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px"></div>'+
      '<div style="font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:14px">Gestion des fournisseurs</div>';
    fournisseursList.forEach(function(f,i){
      var row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #dde8c8';
      row.innerHTML='<span style="font-size:18px">&#128666;</span><div style="flex:1;font-size:14px;font-weight:600">'+f+'</div>';
      var delBtn=document.createElement('button');
      delBtn.style.cssText='background:#ffebee;color:#c62828;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:700';
      delBtn.textContent='Supprimer';
      delBtn.onclick=(function(idx){return function(){fournisseursList.splice(idx,1);saveAll();renderFL();};})(i);
      row.appendChild(delBtn);
      box.appendChild(row);
    });
    var addRow=document.createElement('div');
    addRow.style.cssText='display:flex;gap:8px;margin-top:14px';
    var addInp=document.createElement('input');
    addInp.type='text';addInp.placeholder='Nouveau fournisseur...';
    addInp.style.cssText='flex:1;padding:11px 12px;border:1.5px solid #dde8c8;border-radius:10px;font-size:15px;font-family:inherit;background:#fff';
    var addBtn=document.createElement('button');
    addBtn.style.cssText='background:#22c55e;color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer';
    addBtn.textContent='+';
    addBtn.onclick=function(){var v=addInp.value.trim();if(!v)return;if(fournisseursList.indexOf(v)<0){fournisseursList.push(v);saveAll();}renderFL();};
    addRow.appendChild(addInp);addRow.appendChild(addBtn);
    box.appendChild(addRow);
    var closeBtn=document.createElement('button');
    closeBtn.style.cssText='width:100%;margin-top:12px;background:none;color:#888;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:14px;cursor:pointer';
    closeBtn.textContent='Fermer';
    closeBtn.onclick=function(){overlay.remove();};
    box.appendChild(closeBtn);
  }
  renderFL();
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function filterModulesByRole(role){
  if(!role) return;
  var btns=document.querySelectorAll('.module-card[data-roles]');
  btns.forEach(function(btn){
    var roles=btn.getAttribute('data-roles').split(',');
    btn.style.display=roles.indexOf(role)>=0?'':'none';
  });
}

}

function stockRattachRefreshArticles(div, nomEtiq){
  if(!div) div=document.getElementById('rattach-articles');
  if(!div) return;
  div.innerHTML='';
  var q=(stockRattachSearch||nomEtiq).toLowerCase();
  var filtered=stockItems.filter(function(s){return s.nom.toLowerCase().indexOf(q)>=0;}).slice(0,10);
  if(!filtered.length){
    div.innerHTML='<div style="padding:14px;font-size:13px;color:#bbb;text-align:center">Aucun article correspondant</div>';
    return;
  }
  filtered.forEach(function(s){
    var row=document.createElement('div');
    row.style.cssText='padding:10px 14px;border-bottom:1px solid #dde8c8;display:flex;align-items:center;gap:10px;cursor:pointer;background:#f0fae0';
    row.innerHTML=
      '<div style="flex:1">'+
        '<div style="font-size:14px;font-weight:600;color:#1a1a1a">'+s.nom+'</div>'+
        '<div style="font-size:11px;color:#888">'+s.cat+' · '+s.qte+' '+s.unite+'</div>'+
      '</div>'+
      '<button style="background:#22c55e;color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">Rattacher</button>';
    row.querySelector('button').onclick=(function(sid,nom){return function(){
      var s2=stockItems.find(function(x){return x.id===sid;});
      if(s2){s2.scans=(s2.scans||0)+1;}
      showToast('Rattache : '+nom+' -> '+s2.nom);
      saveAll();
      renderStock();
    };})(s.id, nomEtiq);
    div.appendChild(row);
  });
}

function stockRattachCreerArticle(etiq){
  var newItem={
    id:Date.now(),
    nom:etiq.nom,
    cat:'Alimentaire',
    qte:etiq.poids||0,
    unite:'kg',
    min:0,
    fourn:'—',
    scans:etiq.scans||1,
    dlc:etiq.dlc||''
  };
  stockItems.unshift(newItem);
  saveAll();
  showToast('Article cree : '+etiq.nom);
  renderStock();
}

function stockRefreshEtat(listDiv){
  if(!listDiv) listDiv=document.getElementById('stock-list-div');
  if(!listDiv) return;
  listDiv.innerHTML='';

  var filtered=stockItems.filter(function(s){
    if(stockEtatCat!=='toutes'&&s.cat!==stockEtatCat) return false;
    if(stockEtatSearch){var q=stockEtatSearch.toLowerCase();if(s.nom.toLowerCase().indexOf(q)<0&&(s.cat||'').toLowerCase().indexOf(q)<0) return false;}
    return true;
  });

  // Trier
  if(stockEtatTri==='poids_desc') filtered.sort(function(a,b){return (b.qte||0)-(a.qte||0);});
  else if(stockEtatTri==='poids_asc') filtered.sort(function(a,b){return (a.qte||0)-(b.qte||0);});
  else if(stockEtatTri==='nom') filtered.sort(function(a,b){return a.nom.localeCompare(b.nom);});

  filtered.forEach(function(s){
    var alerte=s.qte===0?'rupture':s.qte<=s.min?'alerte':'ok';
    var dlcStatus='';
    if(s.dlc){
      var p=s.dlc.split('/');
      if(p.length>=2){
        var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):new Date().getFullYear();
        var d=new Date(y,parseInt(p[1])-1,parseInt(p[0]));
        var diff=Math.round((d-new Date())/86400000);
        if(diff<0) dlcStatus='Depassee '+(Math.abs(diff))+'j';
        else if(diff<=7) dlcStatus='J-'+diff;
      }
    }

    var row=document.createElement('div');
    row.style.cssText='padding:12px 14px;border-bottom:1px solid #e8f0d8;background:#f0fae0;display:flex;align-items:center;justify-content:space-between;cursor:pointer';
    row.onclick=(function(sid){return function(){stockOpenEdit(sid);};})(s.id);

    row.innerHTML=
      '<div style="flex:1;min-width:0;margin-right:10px">'+
        '<div style="font-size:14px;font-weight:700;color:#1a1a1a">'+s.nom+'</div>'+
        '<div style="font-size:11px;color:#888;margin-top:2px">'+s.cat+' · '+(s.scans||1)+' scan'+(s.scans>1?'s':'')+' · '+(s.fourn||'—')+(s.dlc?' · DLC mini '+s.dlc:'')+'</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
        '<div style="text-align:right">'+
          '<div style="font-size:16px;font-weight:800;color:#1a1a1a">'+s.qte+' <span style="font-size:12px;font-weight:600;color:#888">'+s.unite+'</span></div>'+
        '</div>'+
        (dlcStatus?'<span style="background:'+(dlcStatus.indexOf('Dep')>=0?'#ffebee':'#fff8e1')+';color:'+(dlcStatus.indexOf('Dep')>=0?'#e53935':'#d97706')+';border-radius:20px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap">'+dlcStatus+'</span>':
         alerte!=='ok'?'<span class="bk '+(alerte==='rupture'?'er':'wn')+'" style="font-size:10px">'+(alerte==='rupture'?'Rupture':'Alerte')+'</span>':'')+
        '<span style="color:#ccc;font-size:18px">&#8250;</span>'+
      '</div>';
    listDiv.appendChild(row);
  });

  if(!filtered.length){
    listDiv.innerHTML='<div style="text-align:center;padding:48px 20px;color:#bbb"><div style="font-size:40px;margin-bottom:12px">📦</div><div style="font-size:15px;font-weight:600;color:#999">Aucun article</div></div>';
  }
}

function stockExportCSV(){
  var rows=[['Nom','Categorie','Quantite','Unite','Stock min','Fournisseur','DLC']];
  stockItems.forEach(function(s){rows.push([s.nom,s.cat,s.qte,s.unite,s.min,s.fourn||'',s.dlc||'']);});
  var csv=rows.map(function(r){return r.join(';');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='stock_restopro.csv';
  a.click();
  showToast('Export CSV lance !');
}

function stockEnregistrerSortie(){
  var selProd=document.getElementById('sort-prod');
  var prodId=parseInt(selProd?selProd.value:0);
  var s=stockItems.find(function(x){return x.id===prodId;});
  if(!s){showToast('Selectionnez un produit');return;}
  var qte=parseFloat(document.getElementById('sort-qte').value)||1;
  if(qte>s.qte){showToast('Stock insuffisant : '+s.qte+' '+s.unite+' disponible');return;}
  var src=document.getElementById('sort-src').value;
  var obs=document.getElementById('sort-obs').value;
  var now=new Date();
  var ini=(currentUser||'Johnny Bauer').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
  s.qte=Math.round((s.qte-qte)*100)/100;
  stockSorties.push({
    id:Date.now(),nom:s.nom,cat:s.cat||'—',qte:qte,unite:s.unite,
    raison:src,obs:obs,par:ini,
    heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    date:now.toISOString().split('T')[0]
  });
  var ov=document.querySelector('[data-overlay]');if(ov)ov.remove();
  saveAll();
  showToast('-'+qte+' '+s.unite+' de '+s.nom+' enregistre !');
  renderStock();
}

function stockRefreshSortirListe(sugDiv, listDiv){
  if(!sugDiv) sugDiv=document.getElementById('sortir-suggestions');
  if(!listDiv) listDiv=document.getElementById('sortir-list');
  var q=stockSortirSearch.toLowerCase().trim();

  // Suggestions
  if(sugDiv){
    sugDiv.innerHTML='';
    if(q.length>=2){
      var filtered=stockItems.filter(function(s){return s.qte>0&&s.nom.toLowerCase().indexOf(q)>=0;});
      if(filtered.length){
        filtered.forEach(function(s){
          var item=document.createElement('div');
          item.style.cssText='padding:12px 14px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:#fff';
          item.innerHTML=
            '<div style="flex:1">'+
              '<div style="font-size:14px;font-weight:700;color:#1a1a1a">'+s.nom+'</div>'+
              '<div style="font-size:11px;color:#888">'+s.cat+' · Stock: '+s.qte+' '+s.unite+'</div>'+
            '</div>'+
            '<button style="background:#e53935;color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">Sortir</button>';
          item.querySelector('button').onclick=(function(sid){return function(e){e.stopPropagation();stockOpenSortieForm(sid);};})(s.id);
          item.onmouseover=function(){this.style.background='#f0fae0';};
          item.onmouseout=function(){this.style.background='#fff';};
          sugDiv.appendChild(item);
        });
      } else {
        sugDiv.innerHTML='<div style="padding:12px 14px;font-size:13px;color:#bbb;font-style:italic">Aucun article correspondant</div>';
      }
    }
  }

  // Dernières sorties (toutes)
  if(listDiv){
    listDiv.innerHTML='';
    var sorties=[].concat(stockSorties).reverse().slice(0,30);
    if(!sorties.length){
      listDiv.innerHTML='<div style="text-align:center;padding:40px;color:#bbb;font-size:13px">Aucune sortie enregistree</div>';
      return;
    }
    sorties.forEach(function(s){
      var row=document.createElement('div');
      row.style.cssText='padding:12px 14px;border-bottom:1px solid #dde8c8;display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center';
      var moisCourts=['jan','fev','mar','avr','mai','jun','juil','aout','sep','oct','nov','dec'];
      var dateD=s.date?new Date(s.date+'T12:00:00'):new Date();
      var dateLabel=String(dateD.getDate()).padStart(2,'0')+'/'+String(dateD.getMonth()+1).padStart(2,'0')+' '+s.heure;
      row.innerHTML=
        '<div>'+
          '<div style="font-size:14px;font-weight:700;color:#1a1a1a">'+s.nom+'</div>'+
          '<div style="font-size:11px;color:#888;margin-top:1px">'+(s.raison||'Sortie')+
            (s.obs&&s.obs!==s.raison?' : '+s.obs:'')+
          '</div>'+
        '</div>'+
        '<div style="font-size:12px;color:#888;white-space:nowrap;text-align:right">'+(s.par||'JB')+'</div>'+
        '<div style="font-size:14px;font-weight:800;color:#1a1a1a;white-space:nowrap;text-align:right">'+s.qte.toFixed(2)+' '+s.unite+'</div>'+
        '<div style="font-size:11px;color:#bbb;white-space:nowrap;text-align:right">'+dateLabel+'</div>';
      listDiv.appendChild(row);
    });
  }
}

function stockEffectuerSortie(id){
  var s=stockItems.find(function(x){return x.id===id;});
  if(!s)return;
  var qteInp=document.getElementById('sf-qte');
  var qte=parseFloat(qteInp?qteInp.value:1)||1;
  if(qte>s.qte){showToast('Stock insuffisant : '+s.qte+' '+s.unite+' disponible');return;}
  var src=document.getElementById('sf-src')?document.getElementById('sf-src').value:'Sortie manuelle';
  var obs=document.getElementById('sf-obs')?document.getElementById('sf-obs').value:'';
  var par=document.getElementById('sf-par')?document.getElementById('sf-par').value:'JB';
  s.qte=Math.round((s.qte-qte)*100)/100;
  var now=new Date();
  var mvt={id:Date.now(),nom:s.nom,cat:s.cat||'—',qte:qte,unite:s.unite,
    raison:src,obs:obs,par:par,type:'sortie',source:src,
    heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    date:now.toISOString().split('T')[0]};
  stockSorties.push(mvt);
  stockMouvements.unshift(mvt);
  stockSortirSearch='';
  stockFermerOverlay();
  saveAll();
  showToast('-'+qte+' '+s.unite+' de '+s.nom+' sorti !');
  // Rafraichir la liste
  stockRefreshSortirListe(
    document.getElementById('sortir-suggestions'),
    document.getElementById('sortir-list')
  );
}

function stockRattrapFiltre(mode){rattrapFiltreMode=mode;stockRattrapRefresh();}

function stockRattrapRefresh(){
  var listDiv=document.getElementById('rattraper-list');
  if(!listDiv)return;
  listDiv.innerHTML='';

  // Mettre a jour les boutons filtres
  ['sans_sortie','toutes','avec_sortie'].forEach(function(m,i){
    var b=document.getElementById('ratt-f'+(i+1));
    if(b){
      b.style.background=m===rattrapFiltreMode?'#1B6FE8':'#fff';
      b.style.color=m===rattrapFiltreMode?'#fff':'#555';
      b.style.borderColor=m===rattrapFiltreMode?'#1B6FE8':'#dde8c8';
    }
  });

  if(!prodItems||!prodItems.length){
    listDiv.innerHTML='<div style="text-align:center;padding:48px 20px;color:#bbb"><div style="font-size:40px;margin-bottom:12px">📦</div><div style="font-size:15px;font-weight:600;color:#999">Aucune production enregistree</div></div>';
    return;
  }

  function hasSortie(p){
    return stockSorties.some(function(s){return s.raison==='Production'&&s.obs&&s.obs.indexOf(p.nom)>=0;});
  }

  var filtered=prodItems.filter(function(p){
    if(rattrapFiltreMode==='sans_sortie') return !hasSortie(p);
    if(rattrapFiltreMode==='avec_sortie') return hasSortie(p);
    return true;
  });

  if(!filtered.length){
    var msg=rattrapFiltreMode==='sans_sortie'?'Toutes les productions ont une sortie !':'Aucune production';
    listDiv.innerHTML='<div style="text-align:center;padding:48px 20px;color:#bbb"><div style="font-size:36px;margin-bottom:10px">'+(rattrapFiltreMode==='sans_sortie'?'✅':'📦')+'</div><div style="font-size:14px;font-weight:600;color:#999">'+msg+'</div></div>';
    return;
  }

  filtered.forEach(function(p){
    var avecSortie=hasSortie(p);
    var row=document.createElement('div');
    row.style.cssText='padding:12px 14px;border-bottom:1px solid #e8f0d8;background:#f0fae0;display:flex;align-items:center;justify-content:space-between;gap:10px';
    row.innerHTML=
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:'+(avecSortie?'14':'15')+'px;font-weight:'+(avecSortie?'500':'700')+';color:'+(avecSortie?'#888':'#1a1a1a')+'">'+p.nom+'</div>'+
        '<div style="font-size:11px;color:#888;margin-top:2px">'+p.par+' · '+p.produitLe+' · '+p.qte+' '+p.unite+'</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">'+
        (!avecSortie?'<span style="background:#fff8e1;color:#d97706;border-radius:20px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap">&#9888; Aucune sortie</span>':
                     '<span style="background:#e8f5e9;color:#16a34a;border-radius:20px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap">&#10003; Sortie OK</span>')+
        (!p.fiche?'<span style="font-size:10px;color:#bbb">Sans fiche</span>':'')+
        '<button style="background:#f0fae0;color:#1B6FE8;border:1.5px solid #1B6FE8;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer">&#9998; Corriger</button>'+
      '</div>';
    row.querySelector('button').onclick=(function(prod){return function(){stockRattrapCorriger(prod);};})(p);
    listDiv.appendChild(row);
  });

function stockRattrapEnregistrer(){
  var overlay=document.querySelector('[data-overlay]');

  var artId=parseInt(document.getElementById('ratt-art').value);
  var s=stockItems.find(function(x){return x.id===artId;});

  showToast('Sortie enregistree pour '+p.nom+' !');

  if(!dlc) return '';
  var p=dlc.split('/'); if(p.length<2) return '';
  var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):new Date().getFullYear();
  var d=new Date(y,parseInt(p[1])-1,parseInt(p[0]));
  var diff=Math.round((d-new Date())/86400000);
  if(diff<0) return '<span style="background:#ffebee;color:#e53935;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">DLC '+dlc+' · Depassee '+(Math.abs(diff))+'j</span>';
  if(diff<=7) return '<span style="background:#fff8e1;color:#d97706;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">DLC '+dlc+' · J+'+(diff)+'</span>';
  return '<span style="background:#e8f5e9;color:#16a34a;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">DLC '+dlc+' · J+'+(diff)+'</span>';
}
