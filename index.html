function stockCtrlRefreshListe(listDiv){
  if(!listDiv) listDiv=document.getElementById('ctrl-list');
  if(!listDiv) return;
  var s=stockControleSession;
  if(!s) return;
  listDiv.innerHTML='';
  var filtered=s.items.filter(function(item){
    if(s.filtreMode==='aVoir'&&item.statut!==null) return false;
    if(s.filtreMode==='ok'&&item.statut!=='ok') return false;
    if(s.filtreMode==='pasOk'&&item.statut!=='pasOk') return false;
    if(s.search){
      var q=s.search.toLowerCase();
      if(item.nom.toLowerCase().indexOf(q)<0&&(item.fourn||'').toLowerCase().indexOf(q)<0&&(item.lot||'').toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });
  if(!filtered.length){
    listDiv.innerHTML='<div style="text-align:center;padding:48px 20px;color:#bbb"><div style="font-size:40px;margin-bottom:12px">&#10003;</div><div style="font-size:15px;font-weight:600;color:#999">Aucun article dans cette categorie</div></div>';
    return;
  }
  filtered.forEach(function(item){
    var row=document.createElement('div');
    var isOk=item.statut==='ok';
    var isPasOk=item.statut==='pasOk';
    row.style.cssText='background:'+(isOk?'#f0fff4':isPasOk?'#fff5f5':'#f0fae0')+';padding:12px 14px;border-bottom:1px solid #e8f0d8;display:flex;align-items:center;gap:12px';
    // Icone statut ou placeholder
    var ico=document.createElement('div');
    ico.style.cssText='width:60px;height:60px;border-radius:10px;background:'+(isOk?'#dcfce7':isPasOk?'#fee2e2':'#e8f0ff')+';display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0';
    ico.innerHTML=isOk?'<span style="color:#22c55e;font-size:30px">&#10003;</span>':isPasOk?'<span style="color:#e53935;font-size:30px">&#10005;</span>':'<span style="font-size:26px">&#128230;</span>';
    row.appendChild(ico);
    // Infos
    var info=document.createElement('div');
    info.style.cssText='flex:1;min-width:0';
    var dlcBadge=stockCtrlDlcBadge(item.dlc);
    info.innerHTML=
      '<div style="font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:3px">'+item.nom+'</div>'+
      '<div style="font-size:11px;color:#888;margin-bottom:4px">'+item.qte+' '+item.unite+(item.lot?' · Lot '+item.lot:'')+
        (dlcBadge?' · '+dlcBadge:'')+
      '</div>'+
      '<div style="font-size:11px;color:#bbb">'+(item.fourn||'')+'</div>';
    row.appendChild(info);
    // Boutons OK / Pas OK / Compter
    if(!item.statut){
      var btnWrap=document.createElement('div');
      btnWrap.style.cssText='display:flex;flex-direction:column;gap:6px;flex-shrink:0';

      // Champ saisie quantité comptée
      var qteWrap=document.createElement('div');
      qteWrap.style.cssText='display:flex;align-items:center;gap:4px;margin-bottom:2px';
      var qteInp=document.createElement('input');
      qteInp.type='number'; qteInp.min='0'; qteInp.step='0.1';
      qteInp.placeholder=String(item.qteSysteme||item.qte||'');
      qteInp.style.cssText='width:60px;padding:5px 6px;border:1.5px solid #dde8c8;border-radius:8px;font-size:13px;font-weight:700;text-align:center;background:#fff;font-family:inherit';
      qteInp.value=item.qteComptee!==null?item.qteComptee:'';
      qteInp.oninput=(function(it){return function(){it.qteComptee=this.value===''?null:parseFloat(this.value);};})(item);
      var uniteLabel=document.createElement('span');
      uniteLabel.style.cssText='font-size:11px;color:#888;flex-shrink:0';
      uniteLabel.textContent=item.unite||'';
      qteWrap.appendChild(qteInp);qteWrap.appendChild(uniteLabel);
      btnWrap.appendChild(qteWrap);

      var okBtn=document.createElement('button');
      okBtn.style.cssText='background:#e8f5e9;color:#22c55e;border:1.5px solid #22c55e;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap';
      okBtn.innerHTML='&#10003; OK';
      okBtn.onclick=(function(it){return function(){
        if(it.qteComptee===null) it.qteComptee=it.qteSysteme;
        it.statut='ok';
        stockCtrlRefreshHeader();stockCtrlRefreshListe(listDiv);
      };})(item);

      var pasBtn=document.createElement('button');
      pasBtn.style.cssText='background:#ffebee;color:#e53935;border:1.5px solid #e53935;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap';
      pasBtn.innerHTML='&#10005; Manquant';
      pasBtn.onclick=(function(it){return function(){
        it.qteComptee=0; it.statut='pasOk';
        stockCtrlRefreshHeader();stockCtrlRefreshListe(listDiv);
      };})(item);

      btnWrap.appendChild(okBtn);btnWrap.appendChild(pasBtn);
      row.appendChild(btnWrap);
    } else {
      var statInfo=document.createElement('div');
      statInfo.style.cssText='text-align:right;flex-shrink:0';
      if(item.qteComptee!==null&&item.qteComptee!==item.qteSysteme){
        var diff=Math.round((item.qteComptee-(item.qteSysteme||0))*10)/10;
        statInfo.innerHTML='<div style="font-size:12px;font-weight:700;color:'+(diff<0?'#e53935':'#16a34a')+'">'+(diff>0?'+':'')+diff+' '+item.unite+'</div>'+
          '<div style="font-size:10px;color:#888">Système: '+(item.qteSysteme||0)+'</div>'+
          '<div style="font-size:10px;color:#888">Compté: '+item.qteComptee+'</div>';
      }
      var annBtn=document.createElement('button');
      annBtn.style.cssText='background:#f0fae0;color:#888;border:1.5px solid #dde8c8;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;margin-top:4px';
      annBtn.textContent='Annuler';
      annBtn.onclick=(function(it){return function(){it.statut=null;it.qteComptee=null;stockCtrlRefreshHeader();stockCtrlRefreshListe(listDiv);};})(item);
      statInfo.appendChild(annBtn);
      row.appendChild(statInfo);
    }
    listDiv.appendChild(row);
  });
}

function stockTerminerControle(){
  var ov=document.getElementById('ctrl-overlay');if(ov)ov.remove();
  if(!stockControleSession)return;
  var s=stockControleSession;
  var okC=s.items.filter(function(i){return i.statut==='ok';}).length;
  var pasOkC=s.items.filter(function(i){return i.statut==='pasOk';}).length;
  var corrections=0;
  var now=new Date();
  var dateStr=now.toISOString().split('T')[0];
  var heureStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var par=(currentUser||'Admin').split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,3);

  // Appliquer les corrections de quantité au stock réel
  s.items.forEach(function(item){
    if(item.statut===null) return; // non contrôlé → pas touché
    var stockItem=stockItems.find(function(x){return x.id===item.id;});
    if(!stockItem) return;

    var qteComptee=item.qteComptee;
    if(qteComptee===null) qteComptee=item.qteSysteme; // pas de saisie = OK tel quel

    var ancien=stockItem.qte;
    var diff=Math.round((qteComptee-ancien)*100)/100;

    if(Math.abs(diff)>0.001){
      corrections++;
      stockItem.qte=Math.max(0, qteComptee);
      // Enregistrer le mouvement de correction
      var type=diff<0?'sortie':'entree';
      stockMouvements.unshift({
        id:Date.now()+corrections,
        type:type, source:'Inventaire',
        nom:stockItem.nom,
        lot:stockItem.lot||'—',
        qte:Math.abs(diff),
        unite:stockItem.unite||'',
        par:par,
        date:dateStr, heure:heureStr,
        obs:'Correction inventaire: '+ancien+' → '+qteComptee+' '+stockItem.unite
      });
    }

    // Article marqué pasOk et qte 0 → sortie stock
    if(item.statut==='pasOk'&&qteComptee===0&&ancien>0){
      stockMouvements.unshift({
        id:Date.now()+corrections+1,
        type:'sortie', source:'Inventaire (manquant)',
        nom:stockItem.nom, lot:stockItem.lot||'—',
        qte:ancien, unite:stockItem.unite||'',
        par:par, date:dateStr, heure:heureStr,
        obs:'Produit non trouvé lors de l\'inventaire'
      });
    }
  });

  stockControleHistorique.unshift({
    date:s.date, operateur:s.operateur, nbLots:s.items.length,
    ok:okC, pasOk:pasOkC,
    restants:s.items.filter(function(i){return !i.statut;}).length,
    nbSorties:pasOkC, corrections:corrections, statut:'Termine'
  });
  stockControleSession=null;
  saveAll();
  auditEnregistrer('stock','Inventaire terminé',okC+' OK · '+pasOkC+' manquants · '+corrections+' correction(s)','Stock');
  showToast('Inventaire terminé — '+okC+' OK · '+pasOkC+' manquants · '+corrections+' correction(s) stock');
  stockView='controle'; renderStock();
}

function renderAllergenes(){

  pillsDiv.innerHTML='<div style="font-size:11px;font-weight:700;color:#999;letter-spacing:.06em;margin-bottom:6px">FILTRER PAR ALLERGÈNE</div>';
  ALG_LIST.forEach(function(a){

    pill.onclick=function(){
      var idx=algFilter.indexOf(a.id);
      if(idx>=0)algFilter.splice(idx,1); else algFilter.push(a.id);

    };
    pillsDiv.appendChild(pill);
  });
  el.appendChild(pillsDiv);

  var wrap=document.createElement('div');
  wrap.style.cssText='padding:12px 12px 80px';
  var filtered=algPlats.filter(function(p){
    if(!algFilter.length)return true;
    return algFilter.every(function(aid){return p.alg.indexOf(aid)>=0;});
  });
  if(!filtered.length){wrap.innerHTML='<div style="text-align:center;padding:40px;color:#bbb;font-size:14px">Aucun plat avec ces allergènes</div>';el.appendChild(wrap);return;}
  filtered.forEach(function(p){

      '<div>'+algs+'</div>';
    wrap.appendChild(card);
  });

  addFab(function(){
    var nom=prompt('Nom du plat :');if(!nom)return;
    algPlats.push({id:Date.now(),nom:nom,alg:[]});
    renderAllergenes(); saveAll();
  });
}

function renderDLC(){
  var el=mc(); el.innerHTML=''; el.style.background='#f2f2f7';

  var now=new Date();

  // KPI
  var expired=dlcItems.filter(function(d){
    if(!d.dlc)return false;
    var p=d.dlc.split('/');if(p.length<2)return false;
    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
    return new Date(y,parseInt(p[1])-1,parseInt(p[0]))<now;
  }).length;
  var warning=dlcItems.filter(function(d){
    if(!d.dlc)return false;
    var p=d.dlc.split('/');if(p.length<2)return false;
    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
    var diff=Math.round((new Date(y,parseInt(p[1])-1,parseInt(p[0]))-now)/86400000);
    return diff>=0&&diff<=7;
  }).length;

  var kpi=document.createElement('div');
  kpi.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;background:#f0fae0;border-bottom:1px solid #dde8c8;flex-shrink:0';
  [
    {val:dlcItems.length, label:'TOTAL',      col:'#1B6FE8'},
    {val:warning,          label:'ALERTES J-7',col:warning?'#e67e22':'#16a34a'},
    {val:expired,          label:'EXPIRÉES',   col:expired?'#e53935':'#16a34a'}
  ].forEach(function(k,i){
    var d=document.createElement('div');
    d.style.cssText='padding:12px 6px;text-align:center'+(i<2?';border-right:1px solid #dde8c8':'');
    d.innerHTML='<div style="font-size:24px;font-weight:800;color:'+k.col+'">'+k.val+'</div>'+
      '<div style="font-size:9px;font-weight:700;color:#888;text-transform:uppercase;margin-top:2px">'+k.label+'</div>';
    kpi.appendChild(d);
  });
  el.appendChild(kpi);

  var wrap=document.createElement('div');
  wrap.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:80px';

  if(!dlcItems.length){
    wrap.innerHTML='<div style="text-align:center;padding:60px 20px;color:#bbb"><div style="font-size:52px;margin-bottom:12px">📅</div><div style="font-size:16px;font-weight:600;color:#999">Aucune DLC enregistrée</div><div style="font-size:13px;color:#bbb;margin-top:6px">Scannez des étiquettes pour alimenter cette liste</div></div>';
    el.appendChild(wrap);
    addFab(function(){dlcOpenAdd();});
    return;
  }

  // Trier par DLC la plus proche
  var sorted=dlcItems.slice().sort(function(a,b){
    function toMs(dlc){
      if(!dlc)return 99999999999;
      var p=dlc.split('/');if(p.length<2)return 99999999999;
      var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):new Date().getFullYear();
      return new Date(y,parseInt(p[1])-1,parseInt(p[0])).getTime();
    }
    return toMs(a.dlc)-toMs(b.dlc);
  });

  sorted.forEach(function(d){
    var diff=null, statut='', col='#888', bg='#f0fae0';
    if(d.dlc){
      var p=d.dlc.split('/');
      if(p.length>=2){
        var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
        var date=new Date(y,parseInt(p[1])-1,parseInt(p[0]));
        diff=Math.round((date-now)/86400000);
        if(diff<0){statut='Dépassée '+(Math.abs(diff))+'j';col='#e53935';bg='#ffebee';}
        else if(diff===0){statut="Expire aujourd'hui";col='#e53935';bg='#ffebee';}
        else if(diff<=3){statut='J-'+diff+' ⚠️';col='#e53935';bg='#fff8e1';}
        else if(diff<=7){statut='J-'+diff;col='#e67e22';bg='#fff8e1';}
        else{statut='J-'+diff;col:'#16a34a';bg='#f0fae0';}
      }
    }

    var row=document.createElement('div');
    row.style.cssText='background:'+bg+';border-left:4px solid '+col+';padding:12px 14px;border-bottom:1px solid #e8f0d8;display:flex;align-items:center;justify-content:space-between;cursor:pointer';
    row.innerHTML=
      '<div style="flex:1;min-width:0;margin-right:10px">'+
        '<div style="font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:3px">'+d.nom+'</div>'+
        '<div style="font-size:11px;color:#888">'+
          (d.lot&&d.lot!=='—'?'Lot: '+d.lot+' · ':'')+
          (d.fourn&&d.fourn!=='—'?d.fourn+' · ':'')+
          (d.poids&&d.poids!=='—'?d.poids:'')+'</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
        '<div style="text-align:right">'+
          '<div style="font-size:13px;font-weight:700;color:#1a1a1a">'+( d.dlc||'—')+'</div>'+
          (statut?'<div style="font-size:11px;font-weight:700;color:'+col+';margin-top:2px">'+statut+'</div>':'')+
        '</div>'+
        '<button style="background:#1B6FE8;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer;flex-shrink:0" title="Voir étiquette">🏷️</button>'+
      '</div>';

    // Bouton étiquette
    row.querySelector('button').onclick=function(e){e.stopPropagation();dlcVoirEtiquette(d);};
    // Supprimer au tap sur le reste
    row.onclick=(function(did){return function(e){if(e.target.tagName!=='BUTTON')dlcSupprimerItem(did);};})(d.id);
    wrap.appendChild(row);
  });

  el.appendChild(wrap);
  addFab(function(){dlcOpenAdd();});
}

function iaAfficherMessage(container, role, content, animate){
  var isUser=role==='user';
  var msgDiv=document.createElement('div');
  msgDiv.style.cssText='display:flex;justify-content:'+(isUser?'flex-end':'flex-start');
  var bubble=document.createElement('div');
  bubble.style.cssText='max-width:85%;padding:12px 14px;border-radius:'+(isUser?'16px 16px 4px 16px':'16px 16px 16px 4px')+';font-size:13px;line-height:1.6;'+
    (isUser?'background:#1B6FE8;color:#fff;':'background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid rgba(255,255,255,.1)');
  if(animate){
    bubble.style.opacity='0';
    bubble.style.transform='translateY(8px)';
    setTimeout(function(){
      bubble.style.transition='opacity .3s, transform .3s';
      bubble.style.opacity='1';
      bubble.style.transform='translateY(0)';
    },10);
  }
  // Formater le contenu (markdown simple)
  var formatted=content
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>')
    .replace(/^- (.*)/gm,'<span style="display:block;padding-left:8px">&#8226; $1</span>');
  bubble.innerHTML=(isUser?'':' ')+formatted;
  msgDiv.appendChild(bubble);
  container.appendChild(msgDiv);
  if(animate) setTimeout(function(){msgDiv.scrollIntoView({behavior:'smooth',block:'end'});},50);
  return bubble;
}

function iaBtnEnvoyer(){
  var inp=document.getElementById('ia-input');
  if(!inp) return;
  var question=inp.value.trim();
  if(!question||iaEnCours) return;
  inp.value=''; inp.style.height='auto';
  iaEnvoyer(question);
}

function iaEnvoyer(question){
  if(iaEnCours) return;
  iaEnCours=true;

  var messagesDiv=document.getElementById('ia-messages');
  if(!messagesDiv) return;

  // Masquer suggestions
  var suggs=document.getElementById('ia-suggestions');
  if(suggs) suggs.style.display='none';

  // Afficher message utilisateur
  iaAfficherMessage(messagesDiv,'user',question,true);
  iaHistorique.push({role:'user',content:question});

  // Indicateur de frappe
  var typingDiv=document.createElement('div');
  typingDiv.id='ia-typing';
  typingDiv.style.cssText='display:flex;justify-content:flex-start';
  typingDiv.innerHTML='<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:16px 16px 16px 4px;padding:12px 16px;color:#94a3b8;font-size:13px">'+
    '<span style="display:inline-flex;gap:4px">'+
      '<span style="width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:iapulse 1s infinite"></span>'+
      '<span style="width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:iapulse 1s .2s infinite"></span>'+
      '<span style="width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:iapulse 1s .4s infinite"></span>'+
    '</span></div>';
  messagesDiv.appendChild(typingDiv);
  setTimeout(function(){typingDiv.scrollIntoView({behavior:'smooth',block:'end'});},50);

  // Construire le contexte restaurant
  var ctx=iaBuildContext();

  // Construire l'historique pour l'API (max 10 derniers échanges)
  var apiMessages=iaHistorique.slice(-10).map(function(m){return {role:m.role,content:m.content};});

  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", signal:(function(){try{var c=new AbortController();setTimeout(function(){c.abort();},45000);return c.signal;}catch(e){return undefined;}})(),
    headers:(function(){var h={"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"};var k=(parametresData&&parametresData.anthropicApiKey)||"";if(k)h["x-api-key"]=k;return h;})(),
    body:JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      system:ctx,
      messages:apiMessages
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var typing=document.getElementById('ia-typing');
    if(typing) typing.remove();
    var reply=data.content&&data.content[0]?data.content[0].text:"Désolé, je n'ai pas pu répondre.";
    iaHistorique.push({role:'assistant',content:reply});
    iaAfficherMessage(messagesDiv,'assistant',reply,true);
    saveAll();
    iaEnCours=false;
    var sendBtn=document.getElementById('ia-send-btn');
    if(sendBtn) sendBtn.style.background='#1B6FE8';
  })
  .catch(function(){
    var typing=document.getElementById('ia-typing');
    if(typing) typing.remove();
    iaAfficherMessage(messagesDiv,'assistant','Erreur de connexion. Vérifiez votre connexion internet.',true);
    iaEnCours=false;
  });

  var sendBtn=document.getElementById('ia-send-btn');
  if(sendBtn) sendBtn.style.background='#64748b';
}

function iaBuildContext(){
  var now=new Date();
  var todayStr=now.toISOString().split('T')[0];
  var monthKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var stockAlertes=stockItems.filter(function(s){return s.qte>0&&s.qte<=s.min;});
  var stockRuptures=stockItems.filter(function(s){return s.qte===0;});
  var dlcUrgentes=dlcItems.filter(function(d){
    if(!d.dlc)return false;
    var p=d.dlc.split('/');if(p.length<2)return false;
    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
    return Math.round((new Date(y,parseInt(p[1])-1,parseInt(p[0]))-now)/86400000)<=3;
  });
  var frigosHorsNorme=frigosData.filter(function(f){return f.fait&&f.val!==null&&(f.val<f.smin||f.val>f.lim);});
  var frigosNonFaits=frigosData.filter(function(f){return !f.fait;});
  var ventesToday=(ventesData||[]).find(function(v){return v.date===todayStr;});
  var pertesMonth=(pertesData||[]).filter(function(p){return p.date&&p.date.startsWith(monthKey);});
  var pertesMonthCout=pertesMonth.reduce(function(s,p){return s+(p.cout||0);},0);
  var shiftsToday=(planningData||[]).filter(function(p){return p.date===todayStr&&p.type==='travail';});
  var incidentsOuverts=(photosData||[]).filter(function(p){return (p.cat==='incident'||p.cat==='reception')&&p.statut!=='resolu';});
  var venteMois=(ventesData||[]).filter(function(v){return v.date&&v.date.startsWith(monthKey);});
  var caMois=venteMois.reduce(function(s,v){return s+(v.midi?v.midi.ca:0)+(v.soir?v.soir.ca:0);},0);
  var cvMois=venteMois.reduce(function(s,v){return s+(v.midi?v.midi.couverts:0)+(v.soir?v.soir.couverts:0);},0);
  var nomResto=currentResto==='resto2'?'Chez Anne-So':'Chez Johnny';
  var heureStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  var stockRuptStr = stockRuptures.length > 0 ? " (" + stockRuptures.slice(0,3).map(function(s){return s.nom;}).join(', ') + ")" : "";
  var stockAlrtStr = stockAlertes.length > 0 ? " (" + stockAlertes.slice(0,3).map(function(s){return s.nom+" "+s.qte+s.unite;}).join(', ') + ")" : "";
  var frigNfStr = frigosNonFaits.length > 0 ? " (" + frigosNonFaits.map(function(f){return f.nom;}).join(', ') + ")" : "";
  var frigKoStr = frigosHorsNorme.length > 0 ? " (" + frigosHorsNorme.map(function(f){return f.nom+": "+f.val+"C";}).join(', ') + ")" : "";
  var incStr = incidentsOuverts.length > 0 ? " (" + incidentsOuverts.slice(0,2).map(function(p){return p.obs||p.cat;}).join(', ') + ")" : "";
  var venteTodayStr = ventesToday ? "Aujourd'hui: CA " + ((ventesToday.midi?ventesToday.midi.ca:0)+(ventesToday.soir?ventesToday.soir.ca:0)) + "EUR, " + ((ventesToday.midi?ventesToday.midi.couverts:0)+(ventesToday.soir?ventesToday.soir.couverts:0)) + " couverts" : "Pas de ventes saisies";
  var recepStr = (recepItems||[]).slice(0,3).map(function(r){return r.fourn+": "+r.date+" ("+r.statut+")";}).join(' | ') || "Aucune reception";
  var dlcStr = dlcUrgentes.length > 0 ? dlcUrgentes.slice(0,5).map(function(d){return "- "+d.nom+": "+d.dlc;}).join(' | ') : "Aucune DLC urgente";
  var lines=[
    "Tu es l'assistant IA de RestoPro pour le restaurant "+nomResto+". Tu connais toutes les donnees en temps reel.",
    "Reponds en francais, concis, avec des emojis et du **gras**.",
    "DATE: "+todayStr+" | HEURE: "+heureStr,
    "STOCK: "+stockItems.length+" articles | Ruptures: "+stockRuptures.length+stockRuptStr+" | Alertes: "+stockAlertes.length+stockAlrtStr,
    "DLC URGENTES: "+dlcStr,
    "HACCP: "+frigosData.length+" frigos | Non controles: "+frigosNonFaits.length+frigNfStr+" | Hors norme: "+frigosHorsNorme.length+frigKoStr,
    "VENTES: "+venteTodayStr+" | Mois: CA "+caMois.toFixed(0)+"EUR, "+cvMois+" couverts",
    "PERTES (mois): "+pertesMonth.length+" pertes | Cout: "+pertesMonthCout.toFixed(2)+"EUR",
    "PERSONNEL: "+usersData.filter(function(u){return u.actif;}).length+" employes | Shifts aujourd'hui: "+shiftsToday.length,
    "QUALITE: "+incidentsOuverts.length+" incidents non resolus"+incStr,
    "RECEPTIONS: "+recepStr
  ];
  return lines.join("\n");
}

function iaEnvoyer(question){
  if(!question||!question.trim()) return;
  var q=question.trim();
  var inp=document.getElementById('ia-input');
  if(inp) inp.value='';

    if(!s.dlc)return false;

    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):new Date().getFullYear();
    var d=new Date(y,parseInt(p[1])-1,parseInt(p[0]));
    return Math.round((d-new Date())/86400000)<=7;
  }).map(function(s){return {nom:s.nom,dlc:s.dlc,qte:s.qte,unite:s.unite};});

  var stockRuptures=stockItems.filter(function(s){return s.qte===0;}).map(function(s){return s.nom;});
  var stockFaible=stockItems.filter(function(s){return s.qte>0&&s.qte<=s.min;}).map(function(s){return {nom:s.nom,qte:s.qte,min:s.min,unite:s.unite};});
  var frigosNonFaits=frigosData.filter(function(f){return !f.fait;}).map(function(f){return f.nom;});
  var frigosHorsNorme=frigosData.filter(function(f){return f.fait&&f.val!==null&&(f.val<f.smin||f.val>f.lim);}).map(function(f){return {nom:f.nom,val:f.val,lim:f.lim};});
  var sortiesToday=stockSorties.filter(function(s){return s.date===new Date().toISOString().split('T')[0];});

  var contexte='Tu es l\'assistant de RestoPro pour le restaurant "'+
    (currentResto==="resto2"?"Chez Anne-So":"Chez Johnny")+'". Reponds TOUJOURS en francais, de facon concise, directe et utile.\n\n'+
    'STOCK COMPLET ('+stockItems.length+' articles):\n'+JSON.stringify(stockItems.map(function(s){return {nom:s.nom,qte:s.qte,unite:s.unite,min:s.min,cat:s.cat};}))+'.\n\n'+
    'DLC ALERTES (<=7j): '+JSON.stringify(dlcAlertes)+'.\n'+
    'RUPTURES: '+JSON.stringify(stockRuptures)+'.\n'+
    'STOCK FAIBLE: '+JSON.stringify(stockFaible)+'.\n'+
    'FRIGOS NON CONTROLES: '+JSON.stringify(frigosNonFaits)+'.\n'+
    'FRIGOS HORS NORME: '+JSON.stringify(frigosHorsNorme)+'.\n'+
    'TEMPERATURES: '+JSON.stringify(frigosData.map(function(f){return {nom:f.nom,val:f.val,fait:f.fait,signe:f.signe};}))+'.\n'+
    'SORTIES DU JOUR: '+JSON.stringify(sortiesToday.slice(0,10))+'.\n'+
    'PRODUCTIONS: '+JSON.stringify((prodItems||[]).slice(0,10).map(function(p){return {nom:p.nom,qte:p.qte,dlc:p.dlc,par:p.par};}))+'.\n'+
    'EQUIPE: '+JSON.stringify((usersData||[]).filter(function(u){return u.actif;}).map(function(u){return {nom:u.nom,role:u.role};}))+'.\n'+
    'FICHES TECHNIQUES: '+JSON.stringify(fichesData.map(function(f){return {nom:f.nom,cat:f.cat,portions:f.portions};}))+'.\n\n'+
    'Si on demande une commande fournisseur, liste les ruptures + stocks faibles avec quantites a commander.\n'+
    'Si on demande les produits qui expirent, donne les DLC alertes avec le nombre de jours.\n'+
    'Si on demande les temperatures, donne l\'etat de chaque frigo.\n'+
    'Reponds de facon concise et actionnable.';

  // Ajouter bulle "en cours"
  iaHistorique.push({role:'assistant',content:'⏳ Reflexion en cours...'});
  renderIA();

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:500,
      system:contexte,
      messages:[{role:'user',content:q}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var rep=data.content&&data.content[0]?data.content[0].text:'Desolee, je n\'ai pas pu repondre.';
    // Remplacer bulle "en cours"
    iaHistorique[iaHistorique.length-1]={role:'assistant',content:rep};
    renderIA();
  })
  .catch(function(){
    iaHistorique[iaHistorique.length-1]={role:'assistant',content:'Erreur de connexion. Verifiez votre connexion internet.'};
    renderIA();
  });
}

    tableDiv.innerHTML='';
    var titre=document.createElement('div');
    titre.style.cssText='font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px';
    titre.textContent='COMPARATIF PLANNING vs POINTAGES — '+date;
    tableDiv.appendChild(titre);

    var activeUsers=(usersData||[]).filter(function(u){return u.actif!==false;});
    if(!activeUsers.length){
      tableDiv.innerHTML+='<div style="text-align:center;padding:30px;color:#bbb">Aucun employé actif</div>';
      return;
    }

    activeUsers.forEach(function(u){
      // Plannifié ce jour
      var shifts=planningData.filter(function(p){return p.userId===u.id&&p.date===date&&p.type==='travail';});
      // Pointage réel ce jour
      var ptg=pointagesData.find(function(p){return p.nom===u.nom&&p.date===date;});

      var card=document.createElement('div');
      card.style.cssText='background:#f0fae0;border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:4px solid ';

      var statutColor='#888';
      var statutLabel='Non planifié';
      if(ptg&&ptg.entree){
        statutColor='#16a34a';
        statutLabel=ptg.sortie?'✅ Terminé':'🟢 En cours';
      } else if(shifts.length){
        statutColor='#e67e22';
        statutLabel='⚠️ Absent';
      }
      card.style.cssText+= statutColor;

      var planifie=shifts.length?shifts.map(function(s){return (s.debut||'?')+' → '+(s.fin||'?');}).join(', '):'—';
      var reel=ptg&&ptg.entree?(ptg.entree+(ptg.sortie?' → '+ptg.sortie:'…')):'—';

      // Calcul écart si les deux existent
      var ecart='';
      if(ptg&&ptg.entree&&shifts.length&&shifts[0].debut){
        var planH=parseInt(shifts[0].debut.split(':')[0])*60+parseInt(shifts[0].debut.split(':')[1]||0);
        var reetH=parseInt(ptg.entree.split(':')[0])*60+parseInt(ptg.entree.split(':')[1]||0);
        var diff=reetH-planH;
        if(diff!==0) ecart=(diff>0?'+':'')+diff+'min';
      }

      card.innerHTML=
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
          '<div style="font-size:14px;font-weight:700;color:#1a1a1a">'+u.nom+'</div>'+
          '<span style="background:'+(statutColor==='#888'?'#f0f0f0':statutColor==='#16a34a'?'#e8f5e9':statutColor==='#e67e22'?'#fff8e1':'#ffebee')+';color:'+statutColor+';border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">'+statutLabel+'</span>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">'+
          '<div style="background:#fff;border-radius:8px;padding:8px">'+
            '<div style="font-size:9px;font-weight:700;color:#1B6FE8;text-transform:uppercase;margin-bottom:3px">📅 Planifié</div>'+
            '<div style="font-weight:600;color:#1a1a1a">'+planifie+'</div>'+
          '</div>'+
          '<div style="background:#fff;border-radius:8px;padding:8px">'+
            '<div style="font-size:9px;font-weight:700;color:#16a34a;text-transform:uppercase;margin-bottom:3px">⏱️ Réel</div>'+
            '<div style="font-weight:600;color:#1a1a1a">'+reel+(ecart?' <span style="color:#e67e22;font-size:10px">('+ecart+')</span>':'')+'</div>'+
          '</div>'+
        '</div>';
      tableDiv.appendChild(card);
    });

    // Résumé
    var presents=pointagesData.filter(function(p){return p.date===date&&p.entree;}).length;
    var planifies=planningData.filter(function(p){return p.date===date&&p.type==='travail';}).length;
    var resume=document.createElement('div');
    resume.style.cssText='background:#e8f0ff;border-radius:12px;padding:12px 14px;margin-top:8px;display:flex;justify-content:space-between';
    resume.innerHTML='<span style="font-size:13px;font-weight:700;color:#1B6FE8">'+presents+' présent(s) / '+planifies+' planifié(s)</span>'+
      '<span style="font-size:12px;color:#888">'+(planifies>0?Math.round(presents/planifies*100)+'%':'—')+' présence</span>';
    tableDiv.appendChild(resume);
  }

  renderPtgTable(today);
}


function planningRenderHistorique(el){
  var wrap=document.createElement('div');
  wrap.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 80px;flex:1';

  // Récupérer toutes les archives de pointages
  var archives=(planningData||[]).filter(function(p){return p.type==='pointage_archive';});

  if(!archives.length){
    wrap.innerHTML='<div style="text-align:center;padding:60px 20px;color:#bbb">'+
      '<div style="font-size:52px;margin-bottom:12px">📊</div>'+
      '<div style="font-size:15px;font-weight:600;color:#999">Aucun historique</div>'+
      '<div style="font-size:13px;color:#bbb;margin-top:8px">Les journées terminées dans Pointages apparaîtront ici</div>'+
    '</div>';
    el.appendChild(wrap);return;
  }

  // Filtres période
  var now=new Date();
  var filtreDiv=document.createElement('div');
  filtreDiv.style.cssText='display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none';
  var filtre='semaine';
  var filtres=[{id:'jour',label:"Aujourd'hui"},{id:'semaine',label:'Cette semaine'},{id:'mois',label:'Ce mois'},{id:'tout',label:'Tout'}];
  filtres.forEach(function(f){
    var b=document.createElement('button');
    b.style.cssText='padding:6px 14px;font-size:12px;font-weight:700;background:'+(f.id===filtre?'#1B6FE8':'#f0fae0')+';color:'+(f.id===filtre?'#fff':'#555')+';border:1.5px solid '+(f.id===filtre?'#1B6FE8':'#dde8c8')+';border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0';
    b.textContent=f.label;
    b.onclick=(function(fid,btn){return function(){
      filtre=fid;
      filtreDiv.querySelectorAll('button').forEach(function(x){x.style.background='#f0fae0';x.style.color='#555';x.style.borderColor='#dde8c8';});
      btn.style.background='#1B6FE8';btn.style.color='#fff';btn.style.borderColor='#1B6FE8';
      renderContent();
    };})(f.id,b);
    filtreDiv.appendChild(b);
  });
  wrap.appendChild(filtreDiv);

  var contentDiv=document.createElement('div');
  wrap.appendChild(contentDiv);

  function getArchivesFiltrees(){
    var today=now.toISOString().split('T')[0];
    var lundiDate=new Date(now);lundiDate.setDate(now.getDate()-((now.getDay()+6)%7));
    var lundi=lundiDate.toISOString().split('T')[0];
    var debutMois=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';
    return archives.filter(function(a){
      if(filtre==='jour') return a.date===today;
      if(filtre==='semaine') return a.date>=lundi&&a.date<=today;
      if(filtre==='mois') return a.date>=debutMois&&a.date<=today;
      return true;
    }).sort(function(a,b){return b.date.localeCompare(a.date);});
  }

  function renderContent(){
    contentDiv.innerHTML='';
    var filtered=getArchivesFiltrees();
    if(!filtered.length){contentDiv.innerHTML='<div style="text-align:center;padding:30px;color:#bbb;font-size:13px">Aucun pointage sur cette période</div>';return;}

    // KPI de la période
    var totalH=filtered.reduce(function(s,a){return s+(a.heures||0);},0);
    var jours=[...new Set(filtered.map(function(a){return a.date;}))].length;
    var users=[...new Set(filtered.map(function(a){return a.nom;}))];

    var kpiRow=document.createElement('div');
    kpiRow.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px';
    [{val:totalH.toFixed(1)+'h',label:'TOTAL',col:'#1B6FE8',bg:'#e8f0ff'},
     {val:jours,label:'JOURS',col:'#16a34a',bg:'#e8f5e9'},
     {val:users.length,label:'EMPLOYÉS',col:'#e67e22',bg:'#fff8e1'}
    ].forEach(function(k){
      var d=document.createElement('div');
      d.style.cssText='background:'+k.bg+';border-radius:12px;padding:12px;text-align:center';
      d.innerHTML='<div style="font-size:20px;font-weight:800;color:'+k.col+'">'+k.val+'</div>'+
        '<div style="font-size:9px;font-weight:700;color:#888;text-transform:uppercase;margin-top:3px">'+k.label+'</div>';
      kpiRow.appendChild(d);
    });
    contentDiv.appendChild(kpiRow);

    // Grouper par employé
    var byUser={};
    filtered.forEach(function(a){
      if(!byUser[a.nom]) byUser[a.nom]={nom:a.nom,ini:a.ini,poste:a.poste,jours:[],totalH:0};
      byUser[a.nom].jours.push(a);
      byUser[a.nom].totalH+=a.heures||0;
    });

    Object.values(byUser).sort(function(a,b){return b.totalH-a.totalH;}).forEach(function(u){
      var userCard=document.createElement('div');
      userCard.style.cssText='background:#f0fae0;border-radius:14px;padding:14px;margin-bottom:10px';

      // Header employé
      var userHdr=document.createElement('div');
      userHdr.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer';
      userHdr.innerHTML=
        '<div style="width:36px;height:36px;border-radius:50%;background:#1B6FE8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">'+u.ini+'</div>'+
        '<div style="flex:1"><div style="font-size:14px;font-weight:700;color:#1a1a1a">'+u.nom+'</div>'+
        '<div style="font-size:11px;color:#888">'+u.poste+' · '+u.jours.length+' jour(s)</div></div>'+
        '<div style="font-size:18px;font-weight:800;color:#1B6FE8">'+u.totalH.toFixed(1)+'h</div>';

      var detailDiv=document.createElement('div');
      detailDiv.style.display='none';

      userHdr.onclick=function(){
        detailDiv.style.display=detailDiv.style.display==='none'?'block':'none';
      };
      userCard.appendChild(userHdr);

      // Détail des jours
      u.jours.forEach(function(j){
        var jRow=document.createElement('div');
        jRow.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid #dde8c8;font-size:12px';
        var d=new Date(j.date+'T12:00:00');
        var jNoms=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
        jRow.innerHTML=
          '<span style="color:#555;font-weight:600">'+jNoms[d.getDay()]+' '+d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0')+'</span>'+
          '<span style="color:#888">'+j.debut+' → '+j.fin+'</span>'+
          '<span style="font-weight:700;color:#1B6FE8">'+j.travail+'</span>'+
          (j.pause&&j.pause!=='00h00m00s'?'<span style="color:#888;font-size:10px">⏸ '+j.pause+'</span>':'');
        detailDiv.appendChild(jRow);
      });
      userCard.appendChild(detailDiv);
      contentDiv.appendChild(userCard);
    });
  }

  renderContent();
  el.appendChild(wrap);
}

function planningVoirEmploye(userId){
  var u=usersData.find(function(x){return x.id===userId;});
  if(!u)return;
  var now=new Date();
  var monthKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var ini=u.nom.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
  var avatarColors={'Administrateur':'#1B6FE8','Responsable':'#16a34a','Cuisinier':'#e67e22','Serveur':'#9b59b6','Plongeur':'#0891b2'};
  var col=avatarColors[u.role]||'#888';

  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:#f2f2f7;z-index:5000;display:flex;flex-direction:column';

  var hdr=document.createElement('div');
  hdr.style.cssText='background:'+col+';padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;flex-shrink:0';
  var backBtn=document.createElement('button');
  backBtn.style.cssText='background:rgba(255,255,255,.2);border:none;color:#fff;font-size:22px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0';
  backBtn.innerHTML='&#8592;';
  backBtn.onclick=function(){overlay.remove();};
  hdr.appendChild(backBtn);
  hdr.innerHTML+='<div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0">'+ini+'</div>'+
    '<div><div style="font-size:17px;font-weight:700;color:#fff">'+u.nom+'</div><div style="font-size:12px;color:rgba(255,255,255,.8)">'+u.role+'</div></div>';
  overlay.appendChild(hdr);

  var wrap=document.createElement('div');
  wrap.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 100px;flex:1';

  // Stats globales
  var shiftsAll=planningData.filter(function(p){return p.userId===u.id&&p.type==='travail';});
  var heuresMois=shiftsAll.filter(function(p){return p.date&&p.date.startsWith(monthKey);}).reduce(function(s,p){
    if(!p.debut||!p.fin)return s;
    var deb=parseInt(p.debut.split(':')[0])*60+parseInt(p.debut.split(':')[1]);
    var fin=parseInt(p.fin.split(':')[0])*60+parseInt(p.fin.split(':')[1]);
    return s+(fin-deb)/60;
  },0);
  var heuresTotal=shiftsAll.reduce(function(s,p){
    if(!p.debut||!p.fin)return s;
    var deb=parseInt(p.debut.split(':')[0])*60+parseInt(p.debut.split(':')[1]);
    var fin=parseInt(p.fin.split(':')[0])*60+parseInt(p.fin.split(':')[1]);
    return s+(fin-deb)/60;
  },0);
  var congesUser=congesData.filter(function(c){return c.userId===u.id;});
  var absUser=planningData.filter(function(p){return p.userId===u.id&&p.type==='absence';});

  var statsDiv=document.createElement('div');
  statsDiv.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px';
  [
    {val:Math.round(heuresMois*10)/10+'h', label:'Heures ce mois',  col:'#1B6FE8', bg:'#e8f0ff'},
    {val:Math.round(heuresTotal*10)/10+'h',label:'Heures total',    col:'#16a34a', bg:'#e8f5e9'},
    {val:congesUser.filter(function(c){return c.statut==='confirme';}).length, label:'Congés validés', col:'#e67e22', bg:'#fff8e1'},
    {val:absUser.length,                   label:'Absences',         col:absUser.length?'#e53935':'#888', bg:absUser.length?'#ffebee':'#f0f0f0'}
  ].forEach(function(k){
    var d=document.createElement('div');
    d.style.cssText='background:'+k.bg+';border-radius:12px;padding:12px;text-align:center';
    d.innerHTML='<div style="font-size:22px;font-weight:800;color:'+k.col+'">'+k.val+'</div>'+
      '<div style="font-size:10px;font-weight:700;color:#888;text-transform:uppercase;margin-top:3px">'+k.label+'</div>';
    statsDiv.appendChild(d);
  });
  wrap.appendChild(statsDiv);

  // Derniers shifts
  if(shiftsAll.length){
    var shiftTitle=document.createElement('div');
    shiftTitle.style.cssText='font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px';
    shiftTitle.textContent='DERNIERS SHIFTS';
    wrap.appendChild(shiftTitle);
    shiftsAll.slice().reverse().slice(0,8).forEach(function(s){
      var row=document.createElement('div');
      row.style.cssText='background:#f0fae0;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center';
      var deb=parseInt(s.debut.split(':')[0])*60+parseInt(s.debut.split(':')[1]);
      var fin=parseInt(s.fin.split(':')[0])*60+parseInt(s.fin.split(':')[1]);
      var h=Math.round((fin-deb)/60*10)/10;
      row.innerHTML='<div><div style="font-size:13px;font-weight:600;color:#1a1a1a">'+s.date+'</div>'+
        '<div style="font-size:11px;color:#888">'+s.debut+' → '+s.fin+(s.poste&&s.poste!=='—'?' · '+s.poste:'')+'</div></div>'+
        '<div style="font-size:14px;font-weight:700;color:#1B6FE8">'+h+'h</div>';
      wrap.appendChild(row);
    });
  }

  // Congés
  if(congesUser.length){
    var cgTitle=document.createElement('div');
    cgTitle.style.cssText='font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px';
    cgTitle.textContent='CONGÉS';
    wrap.appendChild(cgTitle);
    congesUser.forEach(function(c){
      var row=document.createElement('div');
      var statCol=c.statut==='confirme'?'#22c55e':c.statut==='refuse'?'#e53935':'#f59e0b';
      row.style.cssText='background:#f0fae0;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid '+statCol;
      row.innerHTML='<div><div style="font-size:13px;font-weight:600;color:#1a1a1a">'+c.dateDebut+' → '+c.dateFin+'</div>'+
        '<div style="font-size:11px;color:#888">'+c.motif+'</div></div>'+
        '<span style="background:'+(c.statut==='confirme'?'#e8f5e9':c.statut==='refuse'?'#ffebee':'#fff8e1')+';color:'+statCol+';border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700">'+(c.statut==='confirme'?'Validé':c.statut==='refuse'?'Refusé':'En attente')+'</span>';
      wrap.appendChild(row);
    });
  }

  overlay.appendChild(wrap);

var planningMoisOffset = 0;

function planningRenderMois(el){
  var wrap=document.createElement('div');
  wrap.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:80px';

  var now=new Date();
  var year=now.getFullYear();
  var month=now.getMonth()+planningMoisOffset;
  // Normaliser si dépassement
  while(month>11){month-=12;year++;}
  while(month<0){month+=12;year--;}

  var moisNoms=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var firstDay=new Date(year,month,1);
  var lastDay=new Date(year,month+1,0);
  var startDow=firstDay.getDay()||7; // 1=Lun ... 7=Dim

  // Navigation
  var nav=document.createElement('div');
  nav.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 12px;flex-shrink:0;background:#f0fae0;border-bottom:1px solid #dde8c8';
  var prevBtn=document.createElement('button');
  prevBtn.style.cssText='width:34px;height:34px;border-radius:8px;border:1.5px solid #dde8c8;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0';
  prevBtn.innerHTML='◀';
  prevBtn.onclick=function(){planningMoisOffset--;planningTab='mois';renderPlanning();};
  var nextBtn=document.createElement('button');
  nextBtn.style.cssText=prevBtn.style.cssText;
  nextBtn.innerHTML='▶';
  nextBtn.onclick=function(){planningMoisOffset++;planningTab='mois';renderPlanning();};
  var titleDiv=document.createElement('div');
  titleDiv.style.cssText='flex:1;text-align:center;font-size:16px;font-weight:700;color:#1a1a1a';
  titleDiv.textContent=moisNoms[month]+' '+year;
  nav.appendChild(prevBtn);nav.appendChild(titleDiv);nav.appendChild(nextBtn);
  if(planningMoisOffset!==0){
    var todayBtn=document.createElement('button');
    todayBtn.style.cssText='background:#1B6FE8;color:#fff;border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap';
    todayBtn.textContent="Ce mois";
    todayBtn.onclick=function(){planningMoisOffset=0;planningTab='mois';renderPlanning();};
    nav.appendChild(todayBtn);
  }
  el.appendChild(nav);

  // En-tête jours semaine
  var joursCourts=['L','M','M','J','V','S','D'];
  var headerGrid=document.createElement('div');
  headerGrid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);background:#1B6FE8;padding:6px 4px';
  joursCourts.forEach(function(j){
    var d=document.createElement('div');
    d.style.cssText='text-align:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.8)';
    d.textContent=j;
    headerGrid.appendChild(d);
  });
  el.appendChild(headerGrid);

  // Grille du mois
  var grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#dde8c8;padding:0;flex:1';

  // Cases vides avant le 1er
  for(var e2=1;e2<startDow;e2++){
    var empty=document.createElement('div');
    empty.style.cssText='background:#f2f2f7;min-height:60px';
    grid.appendChild(empty);
  }

  var todayStr=new Date().toISOString().split('T')[0];
  for(var day=1;day<=lastDay.getDate();day++){
    var dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isToday=(dateStr===todayStr);
    var isWe=(new Date(year,month,day).getDay()===0||new Date(year,month,day).getDay()===6);

    var shiftsDay=planningData.filter(function(p){return p.date===dateStr&&p.type==='travail';});
    var abDay=planningData.filter(function(p){return p.date===dateStr&&p.type==='absence';});
    var cgDay=congesData.filter(function(c){return c.dateDebut<=dateStr&&c.dateFin>=dateStr&&c.statut==='confirme';});

    var cell=document.createElement('div');
    cell.style.cssText='background:'+(isToday?'#e8f0ff':isWe?'#f8f8f8':'#f0fae0')+';min-height:64px;padding:4px;cursor:pointer;position:relative;overflow:hidden';

    var numDiv=document.createElement('div');
    numDiv.style.cssText='font-size:12px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'#1B6FE8':isWe?'#bbb':'#1a1a1a')+';margin-bottom:2px;display:flex;align-items:center;justify-content:space-between';
    numDiv.innerHTML='<span>'+day+'</span>'+
      (isToday?'<span style="width:6px;height:6px;border-radius:50%;background:#1B6FE8;display:block"></span>':'');
    cell.appendChild(numDiv);

    // Shifts (max 2 affichés)
    var allEvents=[].concat(
      shiftsDay.map(function(s){var u=usersData.find(function(x){return x.id===s.userId;});return {label:(u?u.nom.split(' ')[0]:s.poste),color:'#22c55e',bg:'#e8f5e9'};}),
      abDay.map(function(a){var u=usersData.find(function(x){return x.id===a.userId;});return {label:(u?u.nom.split(' ')[0]:'Abs'),color:'#e53935',bg:'#ffebee'};}),
      cgDay.map(function(c){var u=usersData.find(function(x){return x.id===c.userId;});return {label:(u?u.nom.split(' ')[0]:'🌴'),color:'#f59e0b',bg:'#fff8e1'};})
    );

    allEvents.slice(0,2).forEach(function(ev){
      var tag=document.createElement('div');
      tag.style.cssText='background:'+ev.bg+';color:'+ev.color+';border-radius:4px;padding:1px 4px;font-size:9px;font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
      tag.textContent=ev.label;
      cell.appendChild(tag);
    });
    if(allEvents.length>2){
      var more=document.createElement('div');
      more.style.cssText='font-size:9px;color:#888;font-weight:600;margin-top:1px';
      more.textContent='+'+( allEvents.length-2)+' autres';
      cell.appendChild(more);
    }

    cell.onclick=(function(ds){return function(){planningVoirJour(ds);};})(dateStr);
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  el.appendChild(wrap);
  addFab(function(){planningAjouterShift(null);});
}

function planningVoirJour(dateStr){
  var shifts=planningData.filter(function(p){return p.date===dateStr;});
  var congesDu=congesData.filter(function(c){return c.dateDebut<=dateStr&&c.dateFin>=dateStr&&c.statut==='confirme';});

  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:5000;display:flex;align-items:flex-end;justify-content:center';
  var box=document.createElement('div');
  box.style.cssText='background:#f0fae0;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto';

  var d=new Date(dateStr+'T12:00:00');
  var jours=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  var moisC=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  box.innerHTML='<div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px"></div>'+
    '<div style="font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:14px">'+jours[d.getDay()]+'. '+d.getDate()+' '+moisC[d.getMonth()]+'</div>';

  if(!shifts.length&&!congesDu.length){
    box.innerHTML+='<div style="text-align:center;padding:24px;color:#bbb;font-size:13px">Aucun shift ni congé ce jour</div>';
  }

  // Shifts
  shifts.forEach(function(s){
    var u=usersData.find(function(x){return x.id===s.userId;});
    var col=s.type==='travail'?'#22c55e':s.type==='absence'?'#e53935':'#f59e0b';
    var row=document.createElement('div');
    row.style.cssText='background:#f0fae0;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:3px solid '+col;
    row.innerHTML='<div style="flex:1">'+
      '<div style="font-size:14px;font-weight:700;color:#1a1a1a">'+(u?u.nom:'—')+'</div>'+
      '<div style="font-size:12px;color:#888;margin-top:2px">'+s.debut+' → '+s.fin+(s.poste&&s.poste!=='—'?' · '+s.poste:'')+'</div>'+
    '</div>'+
    '<span style="font-size:11px;font-weight:700;color:'+col+'">'+(s.type==='travail'?'Travail':s.type==='absence'?'Absence':'Congé')+'</span>';
    box.appendChild(row);
  });

  // Congés
  congesDu.forEach(function(c){
    var u=usersData.find(function(x){return x.id===c.userId;});
    var row=document.createElement('div');
    row.style.cssText='background:#fff8e1;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #f59e0b;display:flex;align-items:center;gap:8px';
    row.innerHTML='<span style="font-size:20px">🌴</span><div>'+
      '<div style="font-size:14px;font-weight:700;color:#1a1a1a">'+(u?u.nom:'—')+'</div>'+
      '<div style="font-size:12px;color:#888">'+c.motif+' · '+c.dateDebut+' → '+c.dateFin+'</div>'+
    '</div>';
    box.appendChild(row);
  });

  var btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:8px;margin-top:12px';
  var addBtn=document.createElement('button');
  addBtn.className='btn-blue';
  addBtn.style.cssText='flex:1;justify-content:center;padding:12px';
  addBtn.innerHTML='+ Shift ce jour';
  addBtn.onclick=function(){overlay.remove();planningAjouterShiftDate(dateStr);};
  var closeBtn=document.createElement('button');
  closeBtn.style.cssText='padding:12px 16px;background:#f0fae0;color:#888;border:1.5px solid #dde8c8;border-radius:22px;cursor:pointer;font-weight:600;font-size:13px';
  closeBtn.textContent='Fermer';
  closeBtn.onclick=function(){overlay.remove();};
  btns.appendChild(addBtn);btns.appendChild(closeBtn);
  box.appendChild(btns);
  overlay.appendChild(box);
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
}

function planningRenderPostes(el){
  var wrap=document.createElement('div');
  wrap.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 80px;flex:1';

  var now=new Date();
  var todayStr=now.toISOString().split('T')[0];

  // Calculer les shifts du jour groupés par poste
  var shiftsToday=planningData.filter(function(p){return p.date===todayStr&&p.type==='travail';});

  // Titre
  var title=document.createElement('div');
  title.style.cssText='font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px';
  title.textContent="AUJOURD'HUI — ÉQUIPE EN SERVICE";
  wrap.appendChild(title);

  // Si pas de shifts aujourd'hui
  if(!shiftsToday.length){
    var empty=document.createElement('div');
    empty.style.cssText='background:#f0fae0;border-radius:14px;padding:20px;text-align:center;color:#bbb;margin-bottom:14px';
    empty.innerHTML='<div style="font-size:36px;margin-bottom:8px">📋</div><div style="font-size:14px;font-weight:600;color:#999">Aucun shift planifie aujourd&#39;hui</div>';
    wrap.appendChild(empty);
  } else {
    // Grouper par poste
    var byPoste={};
    shiftsToday.forEach(function(s){
      var poste=s.poste||'Non défini';
      if(!byPoste[poste]) byPoste[poste]=[];
      byPoste[poste].push(s);
    });

    Object.keys(byPoste).forEach(function(poste){
      var posteCard=document.createElement('div');
      posteCard.style.cssText='background:#f0fae0;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)';
      posteCard.innerHTML='<div style="font-size:12px;font-weight:800;color:#1B6FE8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:#1B6FE8;display:block"></span>'+poste+'</div>';

      byPoste[poste].forEach(function(s){
        var u=usersData.find(function(x){return x.id===s.userId;});
        var ini=(u?u.nom.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2):'??');
        var avatarColors={'Administrateur':'#1B6FE8','Responsable':'#16a34a','Cuisinier':'#e67e22','Serveur':'#9b59b6','Plongeur':'#0891b2'};
        var col=u?avatarColors[u.role]||'#888':'#888';

        var deb=parseInt(s.debut.split(':')[0])*60+parseInt(s.debut.split(':')[1]);
        var fin=parseInt(s.fin.split(':')[0])*60+parseInt(s.fin.split(':')[1]);
        var h=Math.round((fin-deb)/60*10)/10;

        var empRow=document.createElement('div');
        empRow.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e8f0d8';
        empRow.innerHTML='<div style="width:36px;height:36px;border-radius:50%;background:'+col+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">'+ini+'</div>'+
          '<div style="flex:1">'+
            '<div style="font-size:13px;font-weight:700;color:#1a1a1a">'+(u?u.nom:'—')+'</div>'+
            '<div style="font-size:11px;color:#888">'+s.debut+' → '+s.fin+'</div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:14px;font-weight:700;color:#1B6FE8">'+h+'h</div>'+
          '</div>';
        posteCard.appendChild(empRow);
      });
      wrap.appendChild(posteCard);
    });
  }

  // Présence globale semaine
  var sTitle=document.createElement('div');
  sTitle.style.cssText='font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px';
  sTitle.textContent='RÉCAP SEMAINE — HEURES PAR EMPLOYÉ';
  wrap.appendChild(sTitle);

  var monday=new Date(now);
  var dow=now.getDay()||7;
  monday.setDate(now.getDate()-(dow-1));
  var sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  var monStr=monday.toISOString().split('T')[0];
  var sunStr=sunday.toISOString().split('T')[0];

  usersData.filter(function(u){return u.actif;}).forEach(function(u){
    var shifts=planningData.filter(function(p){return p.userId===u.id&&p.type==='travail'&&p.date>=monStr&&p.date<=sunStr;});
    if(!shifts.length) return;
    var heures=shifts.reduce(function(s,p){
      if(!p.debut||!p.fin)return s;
      var deb=parseInt(p.debut.split(':')[0])*60+parseInt(p.debut.split(':')[1]);
      var fin=parseInt(p.fin.split(':')[0])*60+parseInt(p.fin.split(':')[1]);
      return s+(fin-deb)/60;
    },0);
    var ini=u.nom.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
    var avatarColors={'Administrateur':'#1B6FE8','Responsable':'#16a34a','Cuisinier':'#e67e22','Serveur':'#9b59b6','Plongeur':'#0891b2'};
    var col=avatarColors[u.role]||'#888';

    var row=document.createElement('div');
    row.style.cssText='background:#f0fae0;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px';
    row.innerHTML='<div style="width:36px;height:36px;border-radius:50%;background:'+col+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">'+ini+'</div>'+
      '<div style="flex:1">'+
        '<div style="font-size:13px;font-weight:700;color:#1a1a1a">'+u.nom+'</div>'+
        '<div style="font-size:11px;color:#888">'+shifts.length+' jour'+(shifts.length>1?'s':'')+'</div>'+
      '</div>'+
      '<div style="font-size:18px;font-weight:800;color:#1B6FE8">'+Math.round(heures*10)/10+'h</div>';
    wrap.appendChild(row);
  });

  el.appendChild(wrap);
  addFab(function(){planningAjouterShift(null);});
}


function planningRenderSemaine(el){
  var wrap=document.createElement('div');
  wrap.style.cssText='overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 80px;flex:1';

  var now=new Date();
  var monday=new Date(now);
  var day=now.getDay();
  var diff=day===0?-6:1-day;
  monday.setDate(now.getDate()+diff+(planningDateOffset*7));

  var nav=document.createElement('div');
  nav.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px';
  var moisN=['Jan','Fev','Mar','Avr','Mai','Jun','Jul','Aou','Sep','Oct','Nov','Dec'];
  var fri=new Date(monday); fri.setDate(monday.getDate()+6);
  nav.innerHTML=
    '<button onclick="planningDateOffset--;renderPlanning()" style="width:34px;height:34px;border-radius:8px;border:1.5px solid #dde8c8;background:#fff;font-size:16px;cursor:pointer">◀</button>'+
    '<div style="flex:1;text-align:center;font-size:14px;font-weight:700;color:#1a1a1a">'+monday.getDate()+' '+moisN[monday.getMonth()]+' — '+fri.getDate()+' '+moisN[fri.getMonth()]+'</div>'+
    '<button onclick="planningDateOffset++;renderPlanning()" style="width:34px;height:34px;border-radius:8px;border:1.5px solid #dde8c8;background:#fff;font-size:16px;cursor:pointer">▶</button>'+
    (planningDateOffset!==0?'<button onclick="planningDateOffset=0;renderPlanning()" style="background:#1B6FE8;color:#fff;border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer">Auj.</button>':'');
  wrap.appendChild(nav);

  var jours=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  var grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px';
  for(var i=0;i<7;i++){
    var d=new Date(monday); d.setDate(monday.getDate()+i);
    var isToday=d.toDateString()===new Date().toDateString();
    var dk=d.toISOString().split('T')[0];
    var nb=planningData.filter(function(p){return p.date===dk&&p.type==='travail';}).length;
    var cell=document.createElement('div');
    cell.style.cssText='background:'+(isToday?'#1B6FE8':'#f0fae0')+';border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer';
    cell.innerHTML='<div style="font-size:10px;font-weight:700;color:'+(isToday?'rgba(255,255,255,.8)':'#888')+'">'+jours[i]+'</div>'+
      '<div style="font-size:16px;font-weight:700;color:'+(isToday?'#fff':'#1a1a1a')+'">'+d.getDate()+'</div>'+
      (nb?'<div style="font-size:10px;color:'+(isToday?'rgba(255,255,255,.8)':'#1B6FE8')+';font-weight:700">'+nb+'&#10003;</div>':'');
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  // Shifts de la semaine par employé
  usersData.filter(function(u){return u.actif;}).forEach(function(u){
    var shiftsWeek=planningData.filter(function(p){
      return p.userId===u.id&&p.date>=monday.toISOString().split('T')[0]&&p.date<=fri.toISOString().split('T')[0];
    });
    if(!shiftsWeek.length) return;
    var empCard=document.createElement('div');
    empCard.style.cssText='background:#f0fae0;border-radius:12px;padding:12px;margin-bottom:8px';
    var ini=u.nom.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
    empCard.innerHTML='<div style="font-size:13px;font-weight:700;color:#1a1a1a;margin-bottom:8px">'+ini+' '+u.nom+'</div>';
    shiftsWeek.forEach(function(s){
      var row=document.createElement('div');
      row.style.cssText='font-size:12px;color:#555;padding:4px 0;border-bottom:1px solid #e8f0d8;display:flex;justify-content:space-between';
      row.innerHTML='<span>'+s.date+'</span><span>'+s.debut+'–'+s.fin+(s.poste&&s.poste!=='—'?' · '+s.poste:'')+'</span>';
      empCard.appendChild(row);
    });
    wrap.appendChild(empCard);
  });

  el.appendChild(wrap);
  addFab(function(){planningAjouterShift(null);});
}

function planningAjouterConfirm(){
  var uid=parseInt(document.getElementById('pl-user').value);
  var date=document.getElementById('pl-date').value;
  if(!date){showToast('Entrez une date');return;}
  planningData.push({id:Date.now(),userId:uid,date:date,debut:document.getElementById('pl-debut').value,fin:document.getElementById('pl-fin').value,poste:document.getElementById('pl-poste').value||'—',type:'travail',statut:'confirme'});
  var ov=document.querySelector('[data-overlay]');if(ov)ov.remove();
  saveAll();renderPlanning();showToast('Shift ajouté !');
}

function congesCalculerCP(userId, userName){
  var archives=(planningData||[]).filter(function(p){
    return p.type==='pointage_archive'&&(p.userId===userId||p.nom===userName);
  });
  var moisTravailles={};
  archives.forEach(function(a){
    var mois=a.date.substring(0,7);
    if(!moisTravailles[mois])moisTravailles[mois]=0;
    moisTravailles[mois]++;
  });
  var moisComplets=Object.values(moisTravailles).filter(function(nb){return nb>=10;}).length;
  var cpAcquis=Math.round(moisComplets*2.5*10)/10;
  var congesUser=(congesData||[]).filter(function(c){
    return (c.userId===userId||c.userName===userName)&&c.statut==='confirme'&&c.motif==='Congés payés';
  });
  var cpPris=congesUser.reduce(function(s,c){
    if(!c.dateDebut||!c.dateFin)return s;
    var d1=new Date(c.dateDebut);var d2=new Date(c.dateFin);
    var ouvrables=0;
    for(var d=new Date(d1);d<=d2;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)ouvrables++;}
    return s+ouvrables;
  },0);
  return {acquis:cpAcquis,pris:cpPris,restants:Math.round((cpAcquis-cpPris)*10)/10,moisComplets:moisComplets};
}

        noB.style.cssText='flex:1;background:#ffebee;color:#e53935;border:1.5px solid #e53935;border-radius:20px;padding:7px;font-size:12px;font-weight:700;cursor:pointer';

        noB.onclick=(function(cid,en){return function(){
          var cx=(congesData||[]).find(function(x){return x.id===cid;});if(!cx)return;
          cx.statut='refuse';cx.refuseLe=new Date().toISOString().split('T')[0];
          auditEnregistrer('conges','Congé refusé',en,'Planning');
          saveAll();renderPlanning();showToast('Congé refusé');
        };})(c.id,empNom);
        btnsRow.appendChild(okB);btnsRow.appendChild(noB);card.appendChild(btnsRow);
      }
      wrap.appendChild(card);
    });
  }
  el.appendChild(wrap);
  addFab(function(){planningDemanderConge();});
}

function planningConfirmConge(){

  var dateDebut=document.getElementById('cg-deb').value;
  var dateFin=document.getElementById('cg-fin').value;
  var motif=document.getElementById('cg-motif').value||'Congés payés';
  var nbJours=0;
  if(dateDebut&&dateFin){var d1=new Date(dateDebut);var d2=new Date(dateFin);for(var d=new Date(d1);d<=d2;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)nbJours++;}}
  if(motif==='Congés payés'&&emp){
    var cp=congesCalculerCP(userId,emp.nom);
    if(nbJours>cp.restants) showToast('⚠️ Solde insuffisant : '+cp.restants+'j restants, '+nbJours+'j demandés','error',4000);
  }
  congesData.push({id:Date.now(),userId:userId,userName:emp?emp.nom:'—',dateDebut:dateDebut,dateFin:dateFin,joursOuvrables:nbJours,motif:motif,statut:'demande',demandeeLe:new Date().toISOString().split('T')[0]});

  auditEnregistrer('conges','Demande congé',(emp?emp.nom:'—')+' '+dateDebut+'→'+dateFin+' ('+nbJours+'j)','Planning');
  addNotif('🌴','Nouvelle demande de congé',(emp?emp.nom:'—')+' : '+nbJours+'j','warning');
  saveAll();renderPlanning();showToast('Demande soumise — '+nbJours+'j ouvrable(s)');
}

// MODE HORS CONNEXION
// ════════════════════════════════
var offlineQueue = []; // Actions en attente de sync
var isOnline = navigator.onLine;
var offlineLastSave = null;

// Intercepter les appels API quand offline
var originalFetch = window.fetch;
window.fetch = function(url, opts){
  if(!navigator.onLine && url && url.indexOf('anthropic.com')>=0){
    // Mettre en queue ou retourner erreur gracieuse
    return Promise.reject(new Error('Hors connexion — requête IA non disponible'));
  }
  return originalFetch.apply(window, arguments);
};

// Détecter changement de connexion
window.addEventListener('online', function(){
  isOnline = true;
  offlineMasquerBanniere();
  offlineSyncQueue();
  showToast('✅ Connexion rétablie — Synchronisation en cours...');
});

window.addEventListener('offline', function(){
  isOnline = false;
  offlineAfficherBanniere();
  showToast('📡 Connexion perdue — Mode hors ligne activé');
});

function offlineAfficherBanniere(){
  var b=document.getElementById('offline-banner');
  if(b) b.classList.add('show');
}

function offlineMasquerBanniere(){
  var b=document.getElementById('offline-banner');
  if(b) b.classList.remove('show');
}

function offlineRetry(){
  if(navigator.onLine){
    offlineMasquerBanniere();
    offlineSyncQueue();
  } else {
    showToast('Toujours hors connexion...');
  }
}

function offlineSyncQueue(){
  if(!offlineQueue.length) return;
  var ind=document.getElementById('sync-indicator');
  if(ind) ind.classList.add('show');
  // Traiter les actions en queue
  var nb=offlineQueue.length;
  // Ici on pourrait envoyer vers un serveur — pour l'instant on sauvegarde localement
  offlineQueue=[];
  saveAll();
  setTimeout(function(){
    if(ind) ind.classList.remove('show');
    showToast('✅ '+nb+' action(s) synchronisée(s)');
  },1500);
}

// Enregistrer une action pour sync ultérieure si offline
function offlineEnqueue(type, data){
  offlineQueue.push({type:type,data:data,ts:Date.now()});
  if(offlineQueue.length>100) offlineQueue=offlineQueue.slice(-100);
}

// Sauvegarde automatique toutes les 30 secondes
setInterval(function(){
  if(stockItems.length||recepItems.length||tempReleves.length){
    saveAll();
    offlineLastSave=new Date().toISOString();
  }
},30000);

// Vérifier le statut au démarrage
setTimeout(function(){
  if(!navigator.onLine){
    offlineAfficherBanniere();
  }
  // Afficher statut de connexion dans les notifications
  if(!navigator.onLine){
    addNotif('📡','Mode hors ligne','Application en mode hors connexion. Données sauvegardées localement.','info');
    updateNotifBadge();
  }
},2000);

var _ficheCurrentPhoto = null;

function ficheSetPhoto(input){
  if(!input||!input.files||!input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e){
    // Compresser la photo avant de la stocker (max 800px, qualité 0.7)
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var maxW = 800; var maxH = 800;
      var w = img.width; var h = img.height;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      if(h > maxH){ w = Math.round(w*maxH/h); h = maxH; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.7);
      _ficheCurrentPhoto = compressed;

      // Afficher preview
      var prev = document.getElementById('fiche-photo-preview');
      if(prev){
        prev.innerHTML = '<img src="'+compressed+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">'+
          '<div style="position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;border-radius:12px">'+
            '<div style="color:#fff;font-size:13px;font-weight:700;text-align:center">🤖 Analyse en cours...</div>'+
          '</div>';
      }

      // Lancer l'analyse IA
      var b64 = compressed.split(',')[1];
      var apiKey = (parametresData&&parametresData.anthropicApiKey)||'';
      if(!apiKey){
        if(prev) prev.innerHTML = '<img src="'+compressed+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">'+
          '<div style="position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:3px 8px;font-size:11px">✓ Photo OK (pas de clé API)</div>';
        showToast('Clé API manquante — saisie manuelle requise','warning',3000);
        return;
      }

      anthropicCall({
        model:"claude-sonnet-4-6", max_tokens:1000,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
          {type:"text",text:"Analyse cette photo de fiche technique ou recette de cuisine. Reponds UNIQUEMENT en JSON pur sans markdown: {nom, cat (Entree/Plat/Dessert/Sauce/Base/Autre), portions, cout, prix, temps, allergenes, preparation, ingredients:[{nom,qte,unite}]}. Si absent mets null ou valeur vide."}
        ]}]
      })
      .then(function(data){
        var txt = data.content&&data.content[0] ? data.content[0].text : '';
        txt = txt.replace(/```json|```/g,'').trim();
        var info;
        try{ info = JSON.parse(txt); } catch(ex){ info = null; }

        // Mettre à jour preview
        if(prev) prev.innerHTML = '<img src="'+compressed+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">'+
          '<div style="position:absolute;bottom:6px;right:8px;background:rgba(22,163,74,.9);color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700">✅ Analyse OK</div>';

        if(!info){ showToast('Photo lue — remplissage manuel','warning'); return; }

        // Pré-remplir les champs du formulaire
        var cats=['Entrée','Plat','Dessert','Sauce','Base','Autre'];
        if(info.nom){ var n=document.getElementById('ft-nom'); if(n) n.value=info.nom; }
        if(info.cat){
          var catSel=document.getElementById('ft-cat');
          if(catSel){
            cats.forEach(function(c,i){ if(c.toLowerCase().indexOf((info.cat||'').toLowerCase().slice(0,4))>=0) catSel.selectedIndex=i; });
          }
        }
        if(info.portions){ var p=document.getElementById('ft-portions'); if(p) p.value=info.portions; }
        if(info.cout){ var co=document.getElementById('ft-cout'); if(co) co.value=info.cout; }
        if(info.prix){ var pr=document.getElementById('ft-prix'); if(pr) pr.value=info.prix; }
        if(info.allergenes){ var al=document.getElementById('ft-allergenes'); if(al) al.value=info.allergenes; }
        if(info.preparation){ var prep=document.getElementById('ft-preparation'); if(prep) prep.value=info.preparation; }

        // Pré-remplir les ingrédients
        if(info.ingredients&&Array.isArray(info.ingredients)&&info.ingredients.length){
          // Vider la liste existante et reconstruire
          var ingList=document.getElementById('ft-ingredients');
          if(ingList){
            // Déclencher l'ajout des ingrédients via la variable ingredients de la closure
            // On injecte dans les inputs existants ou on en crée
            var existingRows = ingList.querySelectorAll('div');
            info.ingredients.forEach(function(ing, idx){
              var nomInp=document.getElementById('ing-nom-'+idx);
              var qteInp=document.getElementById('ing-qte-'+idx);
              var uniteInp=document.getElementById('ing-unite-'+idx);
              if(nomInp){ nomInp.value=ing.nom||''; }
              if(qteInp){ qteInp.value=ing.qte||0; }
              if(uniteInp){ uniteInp.value=ing.unite||'kg'; }
            });
          }
          showToast('🍽️ Fiche détectée — '+info.ingredients.length+' ingrédient(s) trouvé(s) !','success',3000);
        } else {
          showToast('🍽️ Fiche analysée — vérifiez les champs','success',3000);
        }
      })
      .catch(function(){
        if(prev) prev.innerHTML = '<img src="'+compressed+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">'+
          '<div style="position:absolute;bottom:6px;right:8px;background:rgba(229,57,53,.9);color:#fff;border-radius:6px;padding:3px 8px;font-size:11px">⚠️ Erreur IA</div>';
        showToast('Erreur IA — saisie manuelle requise','error',3000);
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function tracaRefresh(){
  var div=document.getElementById('traca-results'); if(!div) return;
  div.innerHTML='';
  var q=(tracaSearch||'').trim().toLowerCase();
  if(!q){ tracaRenderAccueil(div); return; }
  var resultats=tracaRechercher(q);
  if(!resultats.total){
    div.innerHTML='<div style="text-align:center;padding:48px;color:#bbb"><div style="font-size:48px">🔍</div><div style="font-size:15px;font-weight:600;margin-top:12px">Aucun résultat</div></div>';
    return;
  }
  var resume=document.createElement('div');
  resume.style.cssText='background:#fff8e1;border-left:4px solid #f59e0b;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;color:#d97706;font-weight:700';
  resume.textContent='🔎 '+resultats.total+' résultat(s) pour "'+tracaSearch+'"';
  div.appendChild(resume);
  var alertBtn=document.createElement('button');
  alertBtn.style.cssText='width:100%;background:#e53935;color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;box-sizing:border-box';
  alertBtn.innerHTML='🚨 Déclencher un rappel pour ce lot';
  alertBtn.onclick=function(){tracaOuvrirRappel(tracaSearch);};
  div.appendChild(alertBtn);
  function addSect(title,items,col){
    if(!items.length) return;
    var t=document.createElement('div');
    t.style.cssText='font-size:11px;font-weight:800;color:'+col+';text-transform:uppercase;margin:10px 0 6px';
    t.textContent=title; div.appendChild(t);
    items.forEach(function(item){
      var card=document.createElement('div');
      card.style.cssText='background:#f0fae0;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px';
      card.innerHTML='<strong>'+(item.nom||item.fourn||'—')+'</strong>'+(item.lot?' · Lot: '+item.lot:'')+(item.date?' · '+item.date:'')+(item.qte?' · '+item.qte+' '+(item.unite||''):'');
      div.appendChild(card);
    });
  }
  addSect('📦 EN STOCK',resultats.stock,'#1B6FE8');
  addSect('📥 RÉCEPTIONS',resultats.receptions,'#16a34a');
  addSect('⚙️ PRODUCTIONS',resultats.productions,'#e67e22');
  addSect('📤 SORTIES',resultats.sorties,'#9b59b6');
}

function tracaRechercher(q){
  var res={stock:[],receptions:[],productions:[],sorties:[],total:0};
  function match(obj,fields){return fields.some(function(f){return obj[f]&&String(obj[f]).toLowerCase().indexOf(q)>=0;});}
  (stockItems||[]).forEach(function(s){if(match(s,['nom','lot','fourn'])) res.stock.push(s);});
  (recepItems||[]).forEach(function(r){
    var found=match(r,['fourn','bl','produits']);
    if(!found&&r.lignesProduits) r.lignesProduits.forEach(function(p){if(!found&&match(p,['nom','lot'])){found=true;r._prodNom=p.nom;r._prodLot=p.lot;}});
    if(found) res.receptions.push(r);
  });
  (prodItems||[]).forEach(function(p){if(match(p,['nom','lot','par'])) res.productions.push(p);});
  (stockMouvements||[]).forEach(function(m){if(match(m,['nom','lot','fourn','source'])) res.sorties.push(m);});
  res.total=res.stock.length+res.receptions.length+res.productions.length+res.sorties.length;
  return res;
}

  help.innerHTML='<strong>🔎 Mode d\'emploi :</strong><br>Tapez un numéro de lot, un produit ou un fournisseur pour retrouver tous les endroits où il apparaît.';

  if(allLots.length){

    allLots.slice(0,5).forEach(function(l){

      dh.style.cssText='background:#e8f0ff;padding:8px 14px;font-size:11px;font-weight:800;color:#1B6FE8;text-transform:uppercase;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between';

        var row=document.createElement('div');
        row.style.cssText='padding:11px 14px;border-bottom:1px solid #e8f0d8;background:#f0fae0;display:flex;align-items:flex-start;gap:10px';

          '<div style="flex:1"><div style="font-size:13px;font-weight:700;color:#1a1a1a">'+e.action+'</div>'+
          (e.details?'<div style="font-size:11px;color:#555;margin-top:1px">'+e.details+'</div>':'')+
          '<div style="font-size:10px;color:#888;margin-top:2px">'+e.heure+' · '+e.par+'</div></div>';
        listDiv.appendChild(row);
      });

}

function auditExporter(){
  var d={exporteLe:new Date().toISOString(),journal:auditLog};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);var a=document.createElement('a');
  a.href=u;a.download='audit_'+new Date().toISOString().split('T')[0]+'.json';
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1000);
  showToast('Journal exporté !');
}

function multisiteImporterAutre(){
  var input=document.createElement('input');input.type='file';input.accept='.json';input.style.display='none';

  document.body.appendChild(input);input.click();setTimeout(function(){input.remove();},1000);
}

// ── Notifications ──
var notificationsData = notificationsData || [];

function addNotif(ico, titre, msg, niveau){
  if(!notificationsData) notificationsData=[];
  var recent=notificationsData.find(function(n){return n.titre===titre&&(Date.now()-new Date(n.date).getTime())<300000;});
  if(recent) return;
  notificationsData.unshift({id:Date.now(),ico:ico||'🔔',titre:titre,msg:msg||'',niveau:niveau||'info',lu:false,date:new Date().toISOString()});
  if(notificationsData.length>50) notificationsData=notificationsData.slice(0,50);
  updateNotifBadge();
}

function updateNotifBadge(){
  var badge=document.getElementById('notif-badge');
  var nonLus=(notificationsData||[]).filter(function(n){return !n.lu;}).length;
  if(badge){badge.textContent=nonLus>9?'9+':String(nonLus);badge.style.display=nonLus>0?'flex':'none';}
  document.title=nonLus>0?'('+nonLus+') RestoPro':'RestoPro';
}
