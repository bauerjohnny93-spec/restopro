function checkAllAlertsFull(){
  var now=new Date();
  // DLC expirées
  var dlcExp=(dlcItems||[]).filter(function(d){
    if(!d.dlc)return false;
    var p=d.dlc.split('/');if(p.length<2)return false;
    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
    return new Date(y,parseInt(p[1])-1,parseInt(p[0]))<now;
  });
  var dlcSoon=(dlcItems||[]).filter(function(d){
    if(!d.dlc)return false;
    var p=d.dlc.split('/');if(p.length<2)return false;
    var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
    var diff=Math.round((new Date(y,parseInt(p[1])-1,parseInt(p[0]))-now)/86400000);
    return diff>=0&&diff<=(parametresData.alerteDlcJours||7);
  });
  if(dlcExp.length) addNotif('🔴','DLC expirées',dlcExp.length+' produit(s)','critical');
  if(dlcSoon.length) addNotif('🟡','DLC bientôt expirées',dlcSoon.length+' produit(s) dans '+(parametresData.alerteDlcJours||7)+'j','warning');
  // Frigos
  var frigosKo=(frigosData||[]).filter(function(f){return f.fait&&f.val!==null&&(f.val<f.smin||f.val>f.lim);});
  var frigosNf=(frigosData||[]).filter(function(f){return !f.fait;});
  frigosKo.forEach(function(f){addNotif('🌡️','Frigo hors norme',f.nom+': '+f.val+'°C','critical');});
  if(frigosNf.length) addNotif('🌡️','Frigos non contrôlés',frigosNf.length+' frigo(s)','warning');
  // Stock
  var ruptures=(stockItems||[]).filter(function(s){return s.qte===0;});
  var alertes=(stockItems||[]).filter(function(s){return s.qte>0&&s.qte<=s.min;});
  if(ruptures.length) addNotif('📦','Rupture de stock',ruptures.length+' article(s)','critical');
  if(alertes.length) addNotif('📉','Stock faible',alertes.length+' article(s)','warning');
  // Incidents qualité
  var incidents=(photosData||[]).filter(function(p){return (p.cat==='incident'||p.cat==='reception')&&p.statut!=='resolu';});
  if(incidents.length) addNotif('⚠️','Incidents non résolus',incidents.length+' incident(s)','warning');
}

  stockMouvements.unshift({id:Date.now(),type:'entree',source:'Scan',nom:nom,lot:info.lot||'—',qte:qte,unite:unite,par:par,date:now.toISOString().split('T')[0],heure:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),obs:'Scan étiquette'});

function dashRenderMatin(wrap,now,todayStr,monthKey){
  var score=100; var alertes=[];
  var frigosKo=(frigosData||[]).filter(function(f){return f.fait&&f.val!==null&&(f.val<f.smin||f.val>f.lim);});
  var frigosNf=(frigosData||[]).filter(function(f){return !f.fait;});

  // DLC depuis dlcItems (module DLC)
  var dlcExp=(dlcItems||[]).filter(function(d){if(!d.dlc)return false;var p=d.dlc.split('/');if(p.length<2)return false;var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();return new Date(y,parseInt(p[1])-1,parseInt(p[0]))<now;});
  var dlcU=(dlcItems||[]).filter(function(d){if(!d.dlc)return false;var p=d.dlc.split('/');if(p.length<2)return false;var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();var diff=Math.round((new Date(y,parseInt(p[1])-1,parseInt(p[0]))-now)/86400000);return diff>=0&&diff<=3;});

  // ── Liaison 3 : DLC depuis le Stock (réceptions + productions) ──
  function parseDlcStock(dlcStr){
    if(!dlcStr) return null;
    // Format ISO yyyy-mm-dd
    if(dlcStr.match(/^\d{4}-\d{2}-\d{2}$/)) return new Date(dlcStr);
    // Format jj/mm/aa ou jj/mm/aaaa
    var p=dlcStr.split('/');
    if(p.length>=2){
      var y=p.length===3?(parseInt(p[2])<100?2000+parseInt(p[2]):parseInt(p[2])):now.getFullYear();
      return new Date(y,parseInt(p[1])-1,parseInt(p[0]));
    }
    return null;
  }
  var stockDlcExp=(stockItems||[]).filter(function(s){
    if(!s.dlc) return false;
    var d=parseDlcStock(s.dlc);
    return d && d < now;
  });
  var stockDlcU=(stockItems||[]).filter(function(s){
    if(!s.dlc) return false;
    var d=parseDlcStock(s.dlc);
    if(!d) return false;
    var diff=Math.round((d-now)/86400000);
    return diff>=0&&diff<=3;
  });
  // Fusionner avec dlcItems sans doublon
  var totalExp=dlcExp.length+stockDlcExp.length;
  var totalU=dlcU.length+stockDlcU.length;

  var ruptures=(stockItems||[]).filter(function(s){return s.qte===0;});
  var incidents=(photosData||[]).filter(function(p){return (p.cat==='incident'||p.cat==='reception')&&p.statut!=='resolu';});
  if(frigosNf.length){score-=20;alertes.push({level:'warning',msg:'🌡️ '+frigosNf.length+' frigo(s) non contrôlé(s)',action:function(){openMod('temperatures');}});}
  if(frigosKo.length){score-=30;alertes.push({level:'critical',msg:'🚨 '+frigosKo.length+' frigo(s) hors norme',action:function(){openMod('temperatures');}});}
  if(totalExp>0){score-=20;alertes.push({level:'critical',msg:'📅 '+totalExp+' DLC expirée(s)'+(stockDlcExp.length?' dont '+stockDlcExp.length+' en stock':''),action:function(){openMod('dlc');}});}
  if(totalU>0){score-=10;alertes.push({level:'warning',msg:'⚠️ '+totalU+' DLC dans 3 jours'+(stockDlcU.length?' dont '+stockDlcU.length+' en stock':''),action:function(){openMod('dlc');}});}
  if(ruptures.length){score-=15;alertes.push({level:'critical',msg:'📦 '+ruptures.length+' rupture(s)',action:function(){openMod('stock');}});}
  if(incidents.length){score-=10;alertes.push({level:'warning',msg:'⚠️ '+incidents.length+' incident(s)',action:function(){openMod('qualite');}});}
  // Alertes stock sous minimum
  var sousMin=(stockItems||[]).filter(function(s){return s.min>0&&s.qte>0&&s.qte<=s.min;});
  if(sousMin.length){score-=10;alertes.push({level:'warning',msg:'📉 '+sousMin.length+' article(s) sous stock minimum',action:function(){openMod('stock');}});}
  score=Math.max(0,score);
  var scoreCol=score>=80?'#16a34a':score>=50?'#e67e22':'#e53935';
  var scoreLabel=score>=80?'Tout va bien ✓':score>=50?'À surveiller':'Attention requise';
  var sc=document.createElement('div');
  sc.style.cssText='background:linear-gradient(135deg,'+(score>=80?'#16a34a,#15803d':score>=50?'#e67e22,#c2600a':'#e53935,#b91c1c')+');border-radius:18px;padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:16px';
  sc.innerHTML='<div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="text-align:center"><div style="font-size:22px;font-weight:800;color:#fff">'+score+'</div><div style="font-size:9px;color:rgba(255,255,255,.8)">/100</div></div></div>'+
    '<div><div style="font-size:17px;font-weight:700;color:#fff;margin-bottom:4px">'+scoreLabel+'</div><div style="font-size:12px;color:rgba(255,255,255,.8)">'+alertes.length+' point(s) à traiter</div></div>';
  wrap.appendChild(sc);
  if(alertes.length){
    dashSection(wrap,'ACTIONS REQUISES','#e53935');
    alertes.forEach(function(a){var row=document.createElement('div');row.style.cssText='background:'+(a.level==='critical'?'#ffebee':'#fff8e1')+';border-left:4px solid '+(a.level==='critical'?'#e53935':'#f59e0b')+';border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer';row.innerHTML='<span style="font-size:13px;font-weight:600;color:#1a1a1a">'+a.msg+'</span><span style="font-size:12px;font-weight:700;color:#1B6FE8">Voir →</span>';row.onclick=a.action;wrap.appendChild(row);});
  }
  var tafs=(tafTasks||[]).filter(function(t){return !t.done;});
  if(tafs.length){dashSection(wrap,'TÂCHES EN COURS','#9b59b6');tafs.slice(0,4).forEach(function(t){var r=document.createElement('div');r.style.cssText='background:#f0fae0;border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer';r.innerHTML='<div style="width:20px;height:20px;border-radius:50%;border:2px solid #9b59b6;flex-shrink:0"></div><div style="font-size:13px;color:#1a1a1a">'+t.titre+'</div>';r.onclick=function(){openMod('taf');};wrap.appendChild(r);});}
  var vT=(ventesData||[]).find(function(v){return v.date===todayStr;})||null;
  var caJ=vT?(vT.midi?vT.midi.ca:0)+(vT.soir?vT.soir.ca:0):0;
  var cvJ=vT?(vT.midi?vT.midi.couverts:0)+(vT.soir?vT.soir.couverts:0):0;
  dashSection(wrap,'VUE RAPIDE');
  dashKpiGrid(wrap,[
    {label:"CA AUJOURD'HUI",val:caJ>0?caJ+'€':'—',col:'#1B6FE8',bg:'#e8f0ff',action:function(){openMod('ventes');}},
    {label:'COUVERTS',val:cvJ||'—',col:'#16a34a',bg:'#e8f5e9',action:function(){openMod('ventes');}},
    {label:'ARTICLES STOCK',val:(stockItems||[]).length,col:'#e67e22',bg:'#fff8e1',action:function(){openMod('stock');}},
    {label:'FRIGOS OK',val:(frigosData||[]).filter(function(f){return f.fait&&f.val>=f.smin&&f.val<=f.lim;}).length+'/'+(frigosData||[]).length,col:frigosKo.length?'#e53935':'#16a34a',bg:frigosKo.length?'#ffebee':'#e8f5e9',action:function(){openMod('temperatures');}}

    var progBar=document.createElement('div');
    progBar.style.cssText='background:#dde8c8;height:4px;flex-shrink:0';
    var progFill=document.createElement('div');

          '</div>';

function achatValiderCommande(id){
  var achat=(achatsData||[]).find(function(a){return String(a.id)===String(id);});
  if(!achat) return;
  // Marquer comme reçu
  achat.statut='recu';
  achat.dateReception=new Date().toISOString().split('T')[0];
  // Mettre à jour le stock
  var existing=stockItems.find(function(s){return s.nom.toLowerCase()===achat.produit.toLowerCase();});
  if(existing){
    existing.qte=Math.round((existing.qte+(parseFloat(achat.qte)||1))*100)/100;
    existing.fourn=achat.fourn||existing.fourn;
  } else {
    stockItems.unshift({id:Date.now(),nom:achat.produit,cat:'Alimentaire',qte:parseFloat(achat.qte)||1,unite:achat.unite||'kg',min:0,fourn:achat.fourn||'',dlc:'',lot:'',scans:0});
  }
  auditEnregistrer('achats','Commande reçue',achat.produit+' ('+achat.fourn+')','Achats');
  saveAll();
  showToast('✅ '+achat.produit+' reçu — stock mis à jour !','success',3000);
  renderAchats();
}

function onboardingValiderStep(step){
  var now = new Date();

  if(step.id === 'restaurant'){
    var nomResto = document.getElementById('ob-nom-resto')?document.getElementById('ob-nom-resto').value.trim():'';
    if(!nomResto){ showToast('Entrez le nom de votre restaurant', 'error'); return; }
    var typeResto = document.getElementById('ob-type')?document.getElementById('ob-type').value:'Brasserie';
    var nbCouverts = parseInt(document.getElementById('ob-couverts')?document.getElementById('ob-couverts').value:40)||40;
    // Mettre à jour les paramètres
    parametresData.nomResto1 = nomResto;
    parametresData.couverts_max_midi = Math.round(nbCouverts*0.6);
    parametresData.couverts_max_soir = nbCouverts;
    if(infoData) infoData.nomResto = nomResto;
    auditEnregistrer('system','Onboarding: restaurant configuré', nomResto+' ('+typeResto+')', 'Onboarding');
    showToast('✅ Restaurant "'+nomResto+'" configuré !', 'success');
  }

  if(step.id === 'frigos'){
    var nbFrigosInp = document.getElementById('ob-nb-frigos');
    var nb = parseInt(nbFrigosInp?nbFrigosInp.value:0)||0;
    if(!nb){ showToast('Indiquez le nombre de frigos', 'error'); return; }
    // Créer les frigos
    frigosData = [];
    for(var i=0; i<nb; i++){
      var nomFrigoInp = document.getElementById('ob-frigo-'+i);
      var grpInp = document.getElementById('ob-frigo-grp-'+i);
      var nomFrigo = nomFrigoInp?nomFrigoInp.value:'Frigo '+(i+1);
      var grp = grpInp?grpInp.value:'CUISINE';
      frigosData.push({
        id: Date.now()+i, nom: nomFrigo, groupe: grp,
        smin:-2, smax:4, lim:8, val:null, fait:false,
        heureReleve:'', signe:''
      });
    }
    auditEnregistrer('system','Onboarding: '+nb+' frigo(s) configuré(s)', frigosData.map(function(f){return f.nom;}).join(', '), 'Onboarding');
    showToast('✅ '+nb+' frigo(s) créé(s) !', 'success');
  }

  if(step.id === 'equipe'){
    // Récupérer les employés saisis
    var empList = document.getElementById('ob-equipe-list');
    if(empList){
      var rows = empList.querySelectorAll('div[style*="display:flex"]');
      rows.forEach(function(row, i){
        var nomInp = document.getElementById('ob-emp-nom-'+i);
        var roleInp = document.getElementById('ob-emp-role-'+i);
        if(nomInp&&nomInp.value.trim()){
          var empNom = nomInp.value.trim();
          var empRole = roleInp?roleInp.value:'Serveur';
          var existing = usersData.find(function(u){return u.nom===empNom;});
          if(!existing){
            var newPin = String(Math.floor(1000+Math.random()*9000));
            usersData.push({
              id: Date.now()+i, nom: empNom, role: empRole,
              pin: newPin, actif: true, poste:'—', resto:'resto1'
            });
          }
        }
      });
    }
    auditEnregistrer('system','Onboarding: équipe configurée', usersData.length+' membre(s)', 'Onboarding');
    showToast('✅ Équipe configurée !', 'success');
  }

  if(step.id === 'fournisseurs'){
    // Les fournisseurs sont déjà gérés dans selectedFourns via le closure
    // Récupérer tous les fournisseurs cochés depuis fournisseursList
    auditEnregistrer('system','Onboarding: fournisseurs configurés', fournisseursList.join(', '), 'Onboarding');
    showToast('✅ Fournisseurs enregistrés !', 'success');
  }

  saveAll();
  onboardingStep++;
  afficherStepOnboarding();
}

function terminerOnboarding(){
  var overlay = document.getElementById('onboarding-overlay');
  if(overlay){
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity .3s';
    setTimeout(function(){if(overlay.parentNode)overlay.remove();}, 300);
  }
  onboardingDone = true;
  saveAll();
  auditEnregistrer('system','Onboarding terminé','Configuration initiale complète','Onboarding');
  // Aller sur le Dashboard
  setTimeout(function(){
    openMod('dashboard');
    showToast('🎉 Bienvenue dans RestoPro !', 'success', 4000);
  }, 400);
}

// Bouton pour relancer l'onboarding depuis les paramètres
function relancerOnboarding(){
  onboardingDone = false;
  onboardingStep = 0;
  saveAll();
  lancerOnboarding();
}

      achatsData:achatsData,planningData:planningData,congesData:congesData,
      pertesData:pertesData,auditLog:auditLog,usersData:usersData,parametresData:parametresData,
      photosData:photosData,iaHistorique:iaHistorique,scanHistory:scanHistory,
      fournisseursList:fournisseursList,notificationsData:notificationsData,briefData:briefData,
      chkGroupes:chkGroupes,chkHistorique:chkHistorique,echangesData:echangesData,
      approData:approData,cartonsData:cartonsData,infoData:infoData,produitsVendus:produitsVendus,cartonsData:cartonsData
    };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='RestoPro_Export_'+new Date().toISOString().split('T')[0]+'.json';
    a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);
    showToast('✅ Export téléchargé !','success');
    auditEnregistrer('system','Export données complet','','Administration');
  };
  parent.appendChild(exportBtn);

  // Import des données
  var importBtn=document.createElement('label');
  importBtn.style.cssText='width:100%;background:#f0fae0;color:#1B6FE8;border:1.5px solid #1B6FE8;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box';
  importBtn.innerHTML='📥 Importer des données<input type="file" accept=".json" style="display:none" onchange="adminImporterDonnees(this)">';
  parent.appendChild(importBtn);

  // Vider les données
  var clearBtn=document.createElement('button');
  clearBtn.style.cssText='width:100%;background:#ffebee;color:#e53935;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;box-sizing:border-box';
  clearBtn.innerHTML='🗑️ Réinitialiser toutes les données';
  clearBtn.onclick=function(){
    if(!confirm('Attention ! Toutes les données seront supprimées. Continuer ?')) return;
    localStorage.clear();
    showToast('Données réinitialisées — Rechargement...','warning');
    setTimeout(function(){location.reload();},1500);
  };
  parent.appendChild(clearBtn);

  // Infos système
  var info=document.createElement('div');
  info.style.cssText='background:#f0fae0;border-radius:12px;padding:14px;font-size:13px;color:#555;line-height:2';
  var lsSize=0;
  try{var ls=JSON.stringify(localStorage);lsSize=Math.round(ls.length/1024);}catch(e){}
  info.innerHTML=
    '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #dde8c8"><span>Version</span><strong>RestoPro 3.0</strong></div>'+
    '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #dde8c8"><span>Stockage utilisé</span><strong>'+lsSize+' Ko</strong></div>'+
    '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #dde8c8"><span>Connexion</span><strong>'+(navigator.onLine?'✅ En ligne':'📡 Hors ligne')+'</strong></div>'+
    '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Employés</span><strong>'+(usersData||[]).length+' membres</strong></div>';
  parent.appendChild(info);

  // Relancer onboarding
  var obBtn=document.createElement('button');
  obBtn.style.cssText='width:100%;background:#e8f0ff;color:#1B6FE8;border:1.5px solid #1B6FE8;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;box-sizing:border-box';
  obBtn.innerHTML='🧭 Relancer le guide de configuration';
  obBtn.onclick=function(){relancerOnboarding();};
  parent.appendChild(obBtn);
}

function adminImporterDonnees(input){
  if(!input||!input.files||!input.files[0]) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.tafTasks) tafTasks=data.tafTasks;
      if(data.prodItems) prodItems=data.prodItems;
      if(data.frigosData) frigosData=data.frigosData;
      if(data.tempReleves) tempReleves=data.tempReleves;
      if(data.dlcItems) dlcItems=data.dlcItems;
      if(data.recepItems) recepItems=data.recepItems;
      if(data.stockItems) stockItems=data.stockItems;
      if(data.stockMouvements) stockMouvements=data.stockMouvements;
      if(data.algPlats) algPlats=data.algPlats;
      if(data.fichesData) fichesData=data.fichesData;
      if(data.ventesData) ventesData=data.ventesData;
      if(data.caisseData) caisseData=data.caisseData;
      if(data.achatsData) achatsData=data.achatsData;
      if(data.planningData) planningData=data.planningData;
      if(data.congesData) congesData=data.congesData;
      if(data.pertesData) pertesData=data.pertesData;
      if(data.auditLog) auditLog=data.auditLog;
      if(data.usersData) usersData=data.usersData;
      if(data.parametresData) parametresData=Object.assign({},parametresDefaut,data.parametresData);
      if(data.photosData) photosData=data.photosData;
      if(data.fournisseursList) fournisseursList=data.fournisseursList;
      if(data.notificationsData) notificationsData=data.notificationsData;
      if(data.briefData) briefData=data.briefData;
      if(data.chkGroupes) chkGroupes=data.chkGroupes;
      if(data.approData) approData=data.approData;
      if(data.infoData) infoData=data.infoData;
      if(data.produitsVendus) produitsVendus=data.produitsVendus;
      if(data.cartonsData) cartonsData=data.cartonsData;
      saveAll();
      showToast('✅ Données importées !','success');
      auditEnregistrer('system','Import données','Fichier importé','Administration');
      setTimeout(function(){location.reload();},1500);
    }catch(ex){
      showToast('Erreur lecture fichier JSON','error');
    }
  };
  reader.readAsText(input.files[0]);
}
